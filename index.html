<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semerkand Kurtköy Vakfı — Takip Sistemi</title>
<style>
:root{
  /* Semerkand marka turkuazı: #4BBFC2 */
  --yesil:#0B4F55; --yesil-2:#0F6E77; --yesil-3:#4BBFC2;
  --pirinc:#4BBFC2; --pirinc-ac:#A5E2E4;
  --kagit:#F1F6F6; --kart:#FFFFFF;
  --murekkep:#10201F; --soluk:#5E7375; --cizgi:#D3E1E2;
  --kirmizi:#A32C1C; --mavi:#1B4B6B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",-apple-system,Roboto,Helvetica,sans-serif;
  background:var(--kagit);color:var(--murekkep);
  font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--cizgi);
  border-radius:6px;background:#fff;color:var(--murekkep)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yesil-3);outline-offset:-1px}
.gizli{display:none !important}

/* ---------- GİRİŞ ---------- */
#giris{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(155deg,#4BBFC2 0%,#1E8A92 46%,#0B4F55 100%)}
.giris-kutu{background:var(--kart);width:100%;max-width:380px;padding:34px 32px 32px;border-radius:16px;
  box-shadow:0 22px 60px rgba(6,58,62,.38);border-top:5px solid #4BBFC2}
.marka{text-align:center;margin-bottom:26px}
.marka .amblem{height:74px;width:auto;margin:0 auto 14px;display:block}
.yan-logo{height:34px;width:auto;display:block;margin-bottom:10px}
.marka h1{font-size:17px;letter-spacing:-.01em}
.marka p{font-size:12px;color:var(--soluk);margin-top:3px;letter-spacing:.08em;text-transform:uppercase}
.alan{margin-bottom:14px}
.alan label{display:block;font-size:12px;font-weight:600;color:var(--soluk);margin-bottom:5px}
.btn{background:var(--yesil);color:#fff;padding:11px 18px;border-radius:6px;font-weight:600;
  font-size:14px;transition:background .15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--yesil-2)}
.btn.tam{width:100%;justify-content:center}
.btn.ikincil{background:#fff;color:var(--murekkep);border:1px solid var(--cizgi)}
.btn.ikincil:hover{background:#E4EFEF}
.btn.tehlike{background:var(--kirmizi)}
.btn.kucuk{padding:6px 11px;font-size:12.5px}
.hata{background:#FBEAE7;color:var(--kirmizi);padding:10px 12px;border-radius:6px;
  font-size:13px;margin-bottom:14px}

/* ---------- DÜZEN ---------- */
#uygulama{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
aside{background:var(--yesil);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.yan-bas{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.yan-bas h2{font-size:14px;font-weight:700;line-height:1.35;margin-top:2px}
.yan-bas span{font-size:10.5px;color:var(--pirinc-ac);letter-spacing:.14em;text-transform:uppercase}
.menu{flex:1;overflow-y:auto;padding:12px 0}
.menu-baslik{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45);
  padding:14px 18px 6px;font-weight:700}
.menu button{display:block;width:100%;text-align:left;padding:9px 18px;color:rgba(255,255,255,.82);
  font-size:13.5px;border-left:3px solid transparent}
.menu button:hover{background:rgba(255,255,255,.07);color:#fff}
.menu button.aktif{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--pirinc-ac);font-weight:600}
.yan-alt{padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px}
.yan-alt .ad{font-weight:600}
.yan-alt .rol{color:var(--pirinc-ac);font-size:11px;margin-top:2px}
.yan-alt button{color:rgba(255,255,255,.6);font-size:12px;margin-top:9px;text-decoration:underline}

main{padding:26px 30px 60px;overflow-x:auto}
.ana-bas{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  border-bottom:2px solid var(--murekkep);padding-bottom:12px;margin-bottom:20px;flex-wrap:wrap}
.ana-bas h1{font-size:24px;letter-spacing:-.02em}
.ana-bas p{font-size:12.5px;color:var(--soluk);margin-top:3px}
.arac{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.arac input{width:210px}

.ozet{display:flex;gap:1px;background:var(--cizgi);border:1px solid var(--cizgi);
  border-radius:8px;overflow:hidden;margin-bottom:18px;flex-wrap:wrap}
.ozet div{background:var(--kart);padding:11px 16px;flex:1;min-width:140px}
.ozet .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soluk);font-weight:700}
.ozet .v{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.02em}

.tablo-kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:8px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th{background:#E6F1F1;text-align:left;padding:10px 12px;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--soluk);font-weight:700;white-space:nowrap;
  border-bottom:1px solid var(--cizgi);position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid #E8F1F1;vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#F5FBFB}
td.sag,th.sag{text-align:right;white-space:nowrap}
.rozet{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.rozet.acik{background:#FBEAE7;color:var(--kirmizi)}
.rozet.kismi{background:#FDF3DC;color:#8A6410}
.rozet.kapali{background:#E4F1E9;color:var(--yesil-2)}
.rozet.bekle{background:#FDF3DC;color:#8A6410}
.rozet.onay{background:#E4F1E9;color:var(--yesil-2)}
.rozet.red{background:#FBEAE7;color:var(--kirmizi)}
.bos{padding:44px 20px;text-align:center;color:var(--soluk);font-size:13.5px}

/* ---------- FORM PENCERESİ ---------- */
.perde{position:fixed;inset:0;background:rgba(6,48,52,.58);display:grid;place-items:center;
  padding:20px;z-index:50;overflow-y:auto}
.pencere{background:var(--kart);width:100%;max-width:620px;border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:90vh;display:flex;flex-direction:column}
.pencere-bas{padding:18px 22px;border-bottom:1px solid var(--cizgi);display:flex;
  justify-content:space-between;align-items:center}
.pencere-bas h3{font-size:16px}
.pencere-govde{padding:20px 22px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.pencere-govde .genis{grid-column:1/-1}
.pencere-alt{padding:15px 22px;border-top:1px solid var(--cizgi);display:flex;
  justify-content:flex-end;gap:9px}
.kapat{font-size:22px;color:var(--soluk);line-height:1}
@media(max-width:760px){
  #uygulama{grid-template-columns:1fr}
  aside{position:static;height:auto}
  .menu{max-height:190px}
  main{padding:18px 16px 50px}
  .pencere-govde{grid-template-columns:1fr}
}
.yukleniyor{padding:50px;text-align:center;color:var(--soluk);font-size:14px}
</style>
</head>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* =====================================================================
   AYARLAR — Supabase > Project Settings > Data API'den kopyala
   ===================================================================== */
const SUPABASE_URL      = "https://zfujfdzhymlrighxhebl.supabase.co";   // Semerkand Kurtkoy projesi
const SUPABASE_ANON_KEY = "sb_publishable_9kUSG4qWWfUI7M8MkQdpQw_LDza6AMj";    // publishable key (tarayıcıda güvenli)
/* ===================================================================== */

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $  = id => document.getElementById(id);

const GOREV_AD = {baskan:"Başkan", mudur:"Müdür", ticaret:"Ticaret",
                  sosyal:"Sosyal", dergi:"Dergi", vekil:"Vekil"};
const KOL_AD   = {erkek:"Erkek Kolu", kadin:"Kadın Kolu"};

let ben = null, moduller = [], aktifModul = null, alanlar = [], kayitlar = [];
let yazabilir = false, silebilir = false, duzenlenen = null;

const paraYaz = n => "₺" + (Number(n)||0).toLocaleString("tr-TR",{maximumFractionDigits:2});
const tarihYaz = t => t ? new Date(t).toLocaleDateString("tr-TR") : "—";

/* ---------------- GİRİŞ ---------------- */
let kurulumModu = false;

(async () => {
  const { data } = await sb.rpc("kurulum_gerekli");
  if (data === true) {
    kurulumModu = true;
    $("ad-alani").classList.remove("gizli");
    $("kurulum-notu").classList.remove("gizli");
    $("giris-btn").textContent = "Kurulumu Tamamla";
  }
})();

$("giris-btn").onclick = async () => {
  const hata = $("giris-hata");
  hata.classList.add("gizli");
  const eposta = $("eposta").value.trim(), sifre = $("sifre").value;
  if (!eposta || !sifre) { hata.textContent = "E-posta ve şifre gerekli."; hata.classList.remove("gizli"); return; }

  if (kurulumModu) {
    if (sifre.length < 6) { hata.textContent = "Şifre en az 6 karakter olmalı."; hata.classList.remove("gizli"); return; }
    $("giris-btn").textContent = "Kuruluyor…";
    const { error: e1 } = await sb.auth.signUp({ email: eposta, password: sifre });
    if (e1) { $("giris-btn").textContent = "Kurulumu Tamamla";
      hata.textContent = "Kurulamadı: " + e1.message; hata.classList.remove("gizli"); return; }
    await sb.auth.signInWithPassword({ email: eposta, password: sifre });
    const { data: ok } = await sb.rpc("ilk_kullanici_kur", { p_ad: $("kurulum-ad").value.trim() });
    $("giris-btn").textContent = "Kurulumu Tamamla";
    if (ok !== true) {
      hata.textContent = "E-posta onayı bekleniyor olabilir. Supabase > Authentication > Sign In / Providers > 'Confirm email' kapalı olmalı.";
      hata.classList.remove("gizli"); return;
    }
    kurulumModu = false;
    baslat(); return;
  }

  $("giris-btn").textContent = "Giriş yapılıyor…";
  const { error } = await sb.auth.signInWithPassword({ email: eposta, password: sifre });
  $("giris-btn").textContent = "Giriş Yap";
  if (error) {
    if (error.message?.includes("Failed to fetch") || error.status === 0 || error.name === "AuthRetryableFetchError") {
      hata.textContent = "Supabase sunucusuna ulaşılamıyor! Proje uyku modunda (Paused) olabilir. Supabase panelinden 'Restore' butonuna basın.";
    } else {
      hata.textContent = "Giriş başarısız: " + (error.message === "Invalid login credentials" ? "E-posta veya şifre hatalı." : error.message);
    }
    hata.classList.remove("gizli");
  }
};
$("sifre").addEventListener("keydown", e => { if (e.key === "Enter") $("giris-btn").click(); });
$("cikis-btn").onclick = async () => { await sb.auth.signOut(); location.reload(); };

sb.auth.onAuthStateChange((_e, oturum) => { if (oturum) baslat(); });
(async () => { const { data } = await sb.auth.getSession(); if (data.session) baslat(); })();

/* ---------------- BAŞLAT ---------------- */
async function baslat() {
  const { data: kul, error } = await sb.from("kullanicilar")
    .select("*").eq("id", (await sb.auth.getUser()).data.user.id).single();

  if (error || !kul) {
    $("giris-hata").textContent = "Hesabınız henüz yetkilendirilmemiş. Müdüre bildirin.";
    $("giris-hata").classList.remove("gizli");
    await sb.auth.signOut();
    return;
  }
  ben = kul;
  $("giris").classList.add("gizli");
  $("uygulama").classList.remove("gizli");
  $("kul-ad").textContent  = ben.ad_soyad;
  $("kul-rol").textContent = `${KOL_AD[ben.kol]} · ${GOREV_AD[ben.gorev]}`;
  await modulleriYukle();
}

async function modulleriYukle() {
  const { data } = await sb.from("moduller").select("*").eq("aktif", true).order("sira");
  moduller = data || [];
  const erkekM = moduller.filter(m => m.kol !== "kadin");
  const kadinM = moduller.filter(m => m.kol === "kadin");

  let html = "";
  if (erkekM.length) {
    html += `<div class="menu-baslik">Vakıf</div>` +
      erkekM.map(m => `<button data-id="${m.id}">${m.ad}</button>`).join("");
  }
  if (kadinM.length) {
    html += `<div class="menu-baslik">Kadın Kolu</div>` +
      kadinM.map(m => `<button data-id="${m.id}">${m.ad}</button>`).join("");
  }
  html += `<div class="menu-baslik">Genel</div><button data-id="talepler">Talepler</button>`;
  if (yonetici()) html += `<button data-id="yonetim">Yönetim</button>`;
  $("menu").innerHTML = html;

  $("menu").querySelectorAll("button").forEach(b => {
    b.onclick = () => b.dataset.id === "talepler" ? talepleriAc()
                    : b.dataset.id === "yonetim"  ? yonetimAc()
                    : modulAc(b.dataset.id);
  });

  if (moduller.length) modulAc(moduller[0].id);
  else $("icerik").innerHTML = `<div class="bos">Görebileceğiniz modül yok. Müdürden yetki isteyin.</div>`;
}

/* ---------------- MODÜL ---------------- */
async function modulAc(id) {
  aktifModul = moduller.find(m => m.id === id);
  if (!aktifModul) return;
  menuIsaretle(id);
  $("modul-ad").textContent = aktifModul.ad + (aktifModul.kol === "kadin" ? " — Kadın Kolu" : "");
  $("modul-aciklama").textContent = aktifModul.aciklama || "";
  $("icerik").innerHTML = `<div class="yukleniyor">Yükleniyor…</div>`;
  $("ara").classList.remove("gizli");

  const [{ data: y }, { data: s }, { data: al }, { data: kay }] = await Promise.all([
    sb.rpc("modul_yazabilir", { p_modul: id }),
    sb.rpc("modul_silebilir", { p_modul: id }),
    sb.from("modul_alanlari").select("*").eq("modul_id", id).order("sira"),
    sb.from("kayitlar").select("*").eq("modul_id", id).order("olusturuldu", { ascending: false })
  ]);

  yazabilir = !!y; silebilir = !!s; alanlar = al || []; kayitlar = kay || [];
  $("ekle-btn").textContent = yazabilir ? "+ Yeni Kayıt" : "+ Talep Oluştur";
  $("ekle-btn").classList.remove("gizli");
  ozetCiz();
  tabloCiz();
}

function menuIsaretle(id) {
  $("menu").querySelectorAll("button").forEach(b =>
    b.classList.toggle("aktif", b.dataset.id === id));
}

function ozetCiz() {
  const paraAlan = alanlar.filter(a => a.tip === "para");
  if (!paraAlan.length || !kayitlar.length) { $("ozet").classList.add("gizli"); return; }
  let html = `<div><div class="k">Kayıt Sayısı</div><div class="v">${kayitlar.length}</div></div>`;
  paraAlan.forEach(a => {
    const t = kayitlar.reduce((s, k) => s + (Number(k.veri[a.kod]) || 0), 0);
    html += `<div><div class="k">${a.etiket} Toplam</div><div class="v">${paraYaz(t)}</div></div>`;
  });
  const b = alanlar.find(a => a.kod === "borc"), o = alanlar.find(a => a.kod === "odenen");
  if (b && o) {
    const kalan = kayitlar.reduce((s, k) =>
      s + ((Number(k.veri.borc) || 0) - (Number(k.veri.odenen) || 0)), 0);
    html += `<div><div class="k">Kalan</div><div class="v" style="color:var(--kirmizi)">${paraYaz(kalan)}</div></div>`;
  }
  $("ozet").innerHTML = html;
  $("ozet").classList.remove("gizli");
}

function hucreYaz(alan, deger) {
  if (deger === null || deger === undefined || deger === "") return "—";
  if (alan.tip === "para")       return paraYaz(deger);
  if (alan.tip === "tarih")      return tarihYaz(deger);
  if (alan.tip === "sayi")       return Number(deger).toLocaleString("tr-TR");
  if (alan.tip === "evet_hayir") return deger ? "Evet" : "Hayır";
  if (alan.kod === "durum") {
    const s = {"Açık":"acik","Kısmi Ödendi":"kismi","Kapandı":"kapali"}[deger] || "bekle";
    return `<span class="rozet ${s}">${deger}</span>`;
  }
  return String(deger);
}

function tabloCiz() {
  const q = $("ara").value.toLowerCase().trim();
  const liste = q ? kayitlar.filter(k => JSON.stringify(k.veri).toLowerCase().includes(q)) : kayitlar;

  if (!liste.length) {
    $("icerik").innerHTML = `<div class="tablo-kutu"><div class="bos">${
      q ? "Aramaya uyan kayıt yok." : "Bu modülde henüz kayıt yok."}</div></div>`;
    return;
  }
  const gosterilecek = alanlar.slice(0, 7);
  $("icerik").innerHTML = `<div class="tablo-kutu"><table>
    <thead><tr>${gosterilecek.map(a =>
      `<th class="${a.tip === "para" || a.tip === "sayi" ? "sag" : ""}">${a.etiket}</th>`).join("")}
      <th class="sag">İşlem</th></tr></thead>
    <tbody>${liste.map(k => `<tr>${gosterilecek.map(a =>
      `<td class="${a.tip === "para" || a.tip === "sayi" ? "sag" : ""}">${hucreYaz(a, k.veri[a.kod])}</td>`).join("")}
      <td class="sag">
        ${yazabilir ? `<button class="btn ikincil kucuk" data-duzenle="${k.id}">Düzenle</button>` : ""}
        ${silebilir ? `<button class="btn tehlike kucuk" data-sil="${k.id}">Sil</button>` : ""}
        ${!yazabilir && !silebilir ? "—" : ""}
      </td></tr>`).join("")}</tbody></table></div>`;

  $("icerik").querySelectorAll("[data-duzenle]").forEach(b =>
    b.onclick = () => formAc(kayitlar.find(k => k.id === b.dataset.duzenle)));
  $("icerik").querySelectorAll("[data-sil]").forEach(b =>
    b.onclick = () => kayitSil(b.dataset.sil));
}

$("ara").oninput = () => { if (aktifModul) tabloCiz(); };

/* ---------------- FORM ---------------- */
$("ekle-btn").onclick = () => formAc(null);
$("form-kapat").onclick = $("form-iptal").onclick = () => $("perde").classList.add("gizli");

function formAc(kayit) {
  duzenlenen = kayit;
  $("form-kaydet").onclick = kayitKaydet;
  $("form-baslik").textContent = kayit ? "Kaydı Düzenle"
    : (yazabilir ? "Yeni Kayıt" : "Talep Oluştur");
  $("form-govde").innerHTML = alanlar.map(a => {
    const d = kayit ? (kayit.veri[a.kod] ?? "") : "";
    const genis = (a.tip === "uzun_metin" || a.kod === "aciklama") ? "genis" : "";
    let girdi;
    if (a.tip === "uzun_metin")
      girdi = `<textarea rows="3" data-kod="${a.kod}">${d}</textarea>`;
    else if (a.tip === "secim")
      girdi = `<select data-kod="${a.kod}"><option value="">— seçiniz —</option>${
        (a.secenekler || []).map(s =>
          `<option ${s === d ? "selected" : ""}>${s}</option>`).join("")}</select>`;
    else if (a.tip === "evet_hayir")
      girdi = `<select data-kod="${a.kod}"><option value="">—</option>
        <option value="1" ${d ? "selected" : ""}>Evet</option>
        <option value="0" ${d === false ? "selected" : ""}>Hayır</option></select>`;
    else {
      const t = a.tip === "tarih" ? "date" : (a.tip === "para" || a.tip === "sayi") ? "number" : "text";
      girdi = `<input type="${t}" ${t === "number" ? 'step="0.01"' : ""} data-kod="${a.kod}" value="${d}">`;
    }
    return `<div class="alan ${genis}">
      <label>${a.etiket}${a.zorunlu ? ' <span style="color:var(--kirmizi)">*</span>' : ""}</label>
      ${girdi}</div>`;
  }).join("");
  $("form-kaydet").textContent = yazabilir ? "Kaydet" : "Talep Gönder";
  $("perde").classList.remove("gizli");
}

async function kayitKaydet() {
  const veri = {};
  let eksik = null;
  $("form-govde").querySelectorAll("[data-kod]").forEach(el => {
    const a = alanlar.find(x => x.kod === el.dataset.kod);
    let v = el.value;
    if (a.zorunlu && !v) eksik = a.etiket;
    if (v === "") { veri[a.kod] = null; return; }
    if (a.tip === "para" || a.tip === "sayi") v = Number(v);
    if (a.tip === "evet_hayir") v = v === "1";
    veri[a.kod] = v;
  });
  if (eksik) { alert(`"${eksik}" alanı zorunlu.`); return; }

  $("form-kaydet").textContent = "Kaydediliyor…";
  const kol = aktifModul.kol || ben.kol;
  const baslik = veri.aciklama || veri.ad_soyad || veri.baslik || null;
  let hata;

  if (!yazabilir) {
    ({ error: hata } = await sb.from("talepler").insert({
      modul_id: aktifModul.id, tip: duzenlenen ? "duzeltme" : "ekleme",
      kayit_id: duzenlenen?.id || null, veri, olusturan: ben.id
    }));
  } else if (duzenlenen) {
    ({ error: hata } = await sb.from("kayitlar")
      .update({ veri, baslik }).eq("id", duzenlenen.id));
  } else {
    ({ error: hata } = await sb.from("kayitlar").insert({
      modul_id: aktifModul.id, kol, veri, baslik, olusturan: ben.id
    }));
  }

  $("form-kaydet").textContent = yazabilir ? "Kaydet" : "Talep Gönder";
  if (hata) { alert("Kaydedilemedi: " + hata.message); return; }
  $("perde").classList.add("gizli");
  yazabilir ? modulAc(aktifModul.id) : alert("Talebiniz gönderildi. Yetkili onayına düştü.");
}

async function kayitSil(id) {
  if (!confirm("Bu kayıt kalıcı olarak silinecek. Emin misiniz?")) return;
  const { error } = await sb.from("kayitlar").delete().eq("id", id);
  if (error) { alert("Silinemedi: " + error.message); return; }
  modulAc(aktifModul.id);
}

/* ---------------- TALEPLER ---------------- */
async function talepleriAc() {
  aktifModul = null;
  menuIsaretle("talepler");
  $("modul-ad").textContent = "Talepler";
  $("modul-aciklama").textContent = "Yetkisi olmayan kullanıcıların açtığı kayıt talepleri";
  $("ozet").classList.add("gizli");
  $("ekle-btn").classList.add("gizli");
  $("ara").classList.add("gizli");
  $("icerik").innerHTML = `<div class="yukleniyor">Yükleniyor…</div>`;

  const { data } = await sb.from("talepler")
    .select("*, moduller(ad), kullanicilar!talepler_olusturan_fkey(ad_soyad)")
    .order("olusturuldu", { ascending: false });

  if (!data?.length) {
    $("icerik").innerHTML = `<div class="tablo-kutu"><div class="bos">Bekleyen talep yok.</div></div>`;
    return;
  }
  const durumSinif = { beklemede:"bekle", onaylandi:"onay", reddedildi:"red" };
  const durumAd    = { beklemede:"Beklemede", onaylandi:"Onaylandı", reddedildi:"Reddedildi" };

  $("icerik").innerHTML = `<div class="tablo-kutu"><table>
    <thead><tr><th>Tarih</th><th>Modül</th><th>Talep Eden</th><th>Tip</th>
    <th>İçerik</th><th>Durum</th><th class="sag">İşlem</th></tr></thead>
    <tbody>${data.map(t => `<tr>
      <td>${tarihYaz(t.olusturuldu)}</td>
      <td>${t.moduller?.ad || "—"}</td>
      <td>${t.kullanicilar?.ad_soyad || "—"}</td>
      <td>${t.tip === "ekleme" ? "Ekleme" : t.tip === "duzeltme" ? "Düzeltme" : "Silme"}</td>
      <td style="max-width:260px;font-size:12px;color:var(--soluk)">${
        Object.entries(t.veri).filter(([,v]) => v).slice(0,3)
          .map(([k,v]) => `${k}: ${v}`).join(" · ") || "—"}</td>
      <td><span class="rozet ${durumSinif[t.durum]}">${durumAd[t.durum]}</span></td>
      <td class="sag">${t.durum === "beklemede"
        ? `<button class="btn kucuk" data-onay="${t.id}">Onayla</button>
           <button class="btn tehlike kucuk" data-red="${t.id}">Reddet</button>`
        : "—"}</td></tr>`).join("")}</tbody></table></div>`;

  $("icerik").querySelectorAll("[data-onay]").forEach(b =>
    b.onclick = () => talepKarar(data.find(t => t.id === b.dataset.onay), true));
  $("icerik").querySelectorAll("[data-red]").forEach(b =>
    b.onclick = () => talepKarar(data.find(t => t.id === b.dataset.red), false));
}

async function talepKarar(talep, onay) {
  if (onay && talep.tip === "ekleme") {
    const m = moduller.find(x => x.id === talep.modul_id);
    const { error } = await sb.from("kayitlar").insert({
      modul_id: talep.modul_id, kol: m?.kol || ben.kol,
      veri: talep.veri, baslik: talep.veri.aciklama || null, olusturan: talep.olusturan
    });
    if (error) { alert("Kayıt oluşturulamadı: " + error.message); return; }
  }
  if (onay && talep.tip === "duzeltme" && talep.kayit_id) {
    await sb.from("kayitlar").update({ veri: talep.veri }).eq("id", talep.kayit_id);
  }
  if (onay && talep.tip === "silme" && talep.kayit_id) {
    await sb.from("kayitlar").delete().eq("id", talep.kayit_id);
  }
  await sb.from("talepler").update({
    durum: onay ? "onaylandi" : "reddedildi",
    karar_veren: ben.id, karar_tarihi: new Date().toISOString()
  }).eq("id", talep.id);
  talepleriAc();
}

/* =====================================================================
   YÖNETİM PANELİ — kullanıcılar, yetkiler, modüller
   ===================================================================== */

function yonetici() {
  if (!ben) return false;
  return ben.gorev === "baskan" || ben.gorev === "mudur";
}
const tamYetkili = () => ben && ben.kol === "erkek" && (ben.gorev === "baskan" || ben.gorev === "mudur");

// Kullanıcı oluştururken oturumumuzun bozulmaması için ayrı bir bağlantı
const sbKayit = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, storageKey: "sk_kayit" }
});

function sifreUret() {
  const harf = "abcdefghjkmnpqrstuvwxyz", buyuk = "ABCDEFGHJKLMNPQRSTUVWXYZ", rakam = "23456789";
  const hepsi = harf + buyuk + rakam;
  let s = harf[Math.floor(Math.random()*harf.length)] + buyuk[Math.floor(Math.random()*buyuk.length)];
  for (let i = 0; i < 6; i++) s += hepsi[Math.floor(Math.random()*hepsi.length)];
  return s + rakam[Math.floor(Math.random()*rakam.length)];
}

async function yonetimAc() {
  aktifModul = null;
  menuIsaretle("yonetim");
  $("modul-ad").textContent = "Yönetim";
  $("modul-aciklama").textContent = "Kullanıcılar, yetkiler ve modüller";
  $("ozet").classList.add("gizli");
  $("ekle-btn").classList.add("gizli");
  $("ara").classList.add("gizli");
  $("icerik").innerHTML = `<div class="yukleniyor">Yükleniyor…</div>`;

  const [{ data: kullar }, { data: mods }] = await Promise.all([
    sb.from("kullanicilar").select("*").order("kol").order("gorev"),
    sb.from("moduller").select("*").order("sira")
  ]);

  $("icerik").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px">
      <h2 style="font-size:15px">Kullanıcılar (${(kullar||[]).length})</h2>
      ${tamYetkili() ? `<button class="btn kucuk" id="kul-ekle">+ Kullanıcı Ekle</button>` : ""}
    </div>
    <div class="tablo-kutu"><table>
      <thead><tr><th>Ad Soyad</th><th>Kol</th><th>Görev</th><th>Durum</th><th class="sag">İşlem</th></tr></thead>
      <tbody>${(kullar||[]).map(k => `<tr>
        <td><b>${k.ad_soyad}</b></td>
        <td>${KOL_AD[k.kol]}</td>
        <td>${GOREV_AD[k.gorev]}</td>
        <td><span class="rozet ${k.aktif ? "kapali" : "acik"}">${k.aktif ? "Aktif" : "Kapalı"}</span></td>
        <td class="sag">
          <button class="btn ikincil kucuk" data-yetki="${k.id}">Yetkiler</button>
          ${tamYetkili() && k.id !== ben.id
            ? `<button class="btn ikincil kucuk" data-durum="${k.id}">${k.aktif ? "Kapat" : "Aç"}</button>` : ""}
        </td></tr>`).join("")}</tbody></table></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px">
      <h2 style="font-size:15px">Modüller (${(mods||[]).length})</h2>
      ${tamYetkili() ? `<button class="btn kucuk" id="mod-ekle">+ Modül Ekle</button>` : ""}
    </div>
    <div class="tablo-kutu"><table>
      <thead><tr><th>Modül Adı</th><th>Kol</th><th>Sorumlu Görev</th><th>Durum</th><th class="sag">İşlem</th></tr></thead>
      <tbody>${(mods||[]).map(m => `<tr>
        <td><b>${m.ad}</b><span class="meta" style="display:block;font-size:11px;color:var(--soluk)">${m.kod}</span></td>
        <td>${m.kol ? KOL_AD[m.kol] : "Ortak"}</td>
        <td>${m.sahip_gorev ? GOREV_AD[m.sahip_gorev] : "—"}</td>
        <td><span class="rozet ${m.aktif ? "kapali" : "acik"}">${m.aktif ? "Açık" : "Kapalı"}</span></td>
        <td class="sag">${tamYetkili()
          ? `<button class="btn ikincil kucuk" data-mdurum="${m.id}">${m.aktif ? "Kapat" : "Aç"}</button>` : "—"}</td>
      </tr>`).join("")}</tbody></table></div>`;

  if ($("kul-ekle")) $("kul-ekle").onclick = kullaniciEkleFormu;
  if ($("mod-ekle")) $("mod-ekle").onclick = modulEkleFormu;
  $("icerik").querySelectorAll("[data-yetki]").forEach(b =>
    b.onclick = () => yetkiFormu(kullar.find(k => k.id === b.dataset.yetki), mods));
  $("icerik").querySelectorAll("[data-durum]").forEach(b =>
    b.onclick = async () => {
      const k = kullar.find(x => x.id === b.dataset.durum);
      await sb.from("kullanicilar").update({ aktif: !k.aktif }).eq("id", k.id);
      yonetimAc();
    });
  $("icerik").querySelectorAll("[data-mdurum]").forEach(b =>
    b.onclick = async () => {
      const m = mods.find(x => x.id === b.dataset.mdurum);
      await sb.from("moduller").update({ aktif: !m.aktif }).eq("id", m.id);
      await modulleriYukle(); yonetimAc();
    });
}

/* ---------------- KULLANICI EKLE ---------------- */

    <div class="alan genis"><label>Ad Soyad *</label><input id="y-ad" placeholder="Ahmet Yılmaz"></div>
    <div class="alan genis"><label>E-posta *</label><input id="y-eposta" type="email" placeholder="ahmet@ornek.com"></div>
    <div class="alan"><label>Kol *</label><select id="y-kol">
      <option value="erkek">Erkek Kolu</option><option value="kadin">Kadın Kolu</option></select></div>
    <div class="alan"><label>Görev *</label><select id="y-gorev">
      <option value="baskan">Başkan</option><option value="mudur">Müdür</option>
      <option value="ticaret">Ticaret</option><option value="sosyal">Sosyal</option>
      <option value="dergi">Dergi</option><option value="vekil">Vekil</option></select></div>

      <div style="font-size:11.5px;color:var(--soluk);margin-top:5px">

  $("form-kaydet").textContent = "Kullanıcıyı Oluştur";
  $("y-yeni-sifre").onclick = () => { $("y-sifre").value = sifreUret(); };
  $("form-kaydet").onclick = kullaniciKaydet;
  $("perde").classList.remove("gizli");
}

async function kullaniciKaydet() {
  const ad = $("y-ad").value.trim(), eposta = $("y-eposta").value.trim();
  const kol = $("y-kol").value, gorev = $("y-gorev").value, sifre = $("y-sifre").value;
  if (!ad || !eposta || sifre.length < 6) { alert("Ad, e-posta ve en az 6 karakter şifre gerekli."); return; }

  $("form-kaydet").textContent = "Oluşturuluyor…";
  const { data, error } = await sbKayit.auth.signUp({ email: eposta, password: sifre });
  if (error) { $("form-kaydet").textContent = "Kullanıcıyı Oluştur";
    alert("Hesap açılamadı: " + error.message); return; }

  const { error: e2 } = await sb.from("kullanicilar")
    .insert({ id: data.user.id, ad_soyad: ad, kol, gorev });
  $("form-kaydet").textContent = "Kullanıcıyı Oluştur";
  if (e2) { alert("Hesap açıldı ama yetki kaydı yapılamadı: " + e2.message); return; }

  await sbKayit.auth.signOut();
  $("perde").classList.add("gizli");
  alert(`Kullanıcı oluşturuldu.\n\nAd: ${ad}\nE-posta: ${eposta}\nŞifre: ${sifre}\n\nBu bilgileri kullanıcıya ilet. Şifre bir daha gösterilmeyecek.`);
  yonetimAc();
}

/* ---------------- YETKİLER ---------------- */
async function yetkiFormu(kul, mods) {
  const { data: izinler } = await sb.from("modul_izinleri")
    .select("*").eq("kullanici_id", kul.id);
  const izin = Object.fromEntries((izinler || []).map(i => [i.modul_id, i]));
  const uygun = mods.filter(m => !m.kol || m.kol === kul.kol);
  const ustYonetim = (kul.gorev === "baskan" || kul.gorev === "mudur");
  const salt = kul.gorev === "vekil";

  $("form-baslik").textContent = `Yetkiler — ${kul.ad_soyad}`;
  $("form-govde").innerHTML = `
    <div class="genis" style="font-size:12.5px;color:var(--soluk);background:#E8F6F6;
      padding:11px 13px;border-radius:7px;line-height:1.5">
      ${ustYonetim
        ? `<b>${GOREV_AD[kul.gorev]}</b> olduğu için ${kul.kol === "erkek" ? "tüm" : "kadın kolunun tüm"} modüllerine zaten erişir. Aşağıdaki tikler ek yetkidir.`
        : salt
        ? `<b>Vekil</b> yalnızca okuyabilir. Yazma tiki koysan da sistem yazmaya izin vermez.`
        : `<b>${GOREV_AD[kul.gorev]}</b> kendi sorumluluğundaki modüle zaten erişir. Diğerleri için aşağıdan yetki ver.`}
    </div>
    <div class="genis"><table style="min-width:0;font-size:12.5px">
      <thead><tr><th>Modül</th><th style="text-align:center">Görür</th>
      <th style="text-align:center">Yazar</th><th style="text-align:center">Siler</th></tr></thead>
      <tbody>${uygun.map(m => {
        const i = izin[m.id] || {};
        return `<tr><td>${m.ad}${m.kol === "kadin" ? " <span style='color:var(--soluk)'>(K)</span>" : ""}</td>
        <td style="text-align:center"><input type="checkbox" style="width:auto" data-o="${m.id}" ${i.okuyabilir ? "checked" : ""}></td>
        <td style="text-align:center"><input type="checkbox" style="width:auto" data-y="${m.id}" ${i.yazabilir ? "checked" : ""} ${salt ? "disabled" : ""}></td>
        <td style="text-align:center"><input type="checkbox" style="width:auto" data-s="${m.id}" ${i.silebilir ? "checked" : ""} ${salt ? "disabled" : ""}></td>
        </tr>`; }).join("")}</tbody></table></div>`;
  $("form-kaydet").textContent = "Yetkileri Kaydet";
  $("form-kaydet").onclick = async () => {
    $("form-kaydet").textContent = "Kaydediliyor…";
    const satirlar = uygun.map(m => ({
      kullanici_id: kul.id, modul_id: m.id, veren_id: ben.id,
      okuyabilir: $("form-govde").querySelector(`[data-o="${m.id}"]`).checked,
      yazabilir:  $("form-govde").querySelector(`[data-y="${m.id}"]`).checked,
      silebilir:  $("form-govde").querySelector(`[data-s="${m.id}"]`).checked
    })).filter(s => s.okuyabilir || s.yazabilir || s.silebilir);

    await sb.from("modul_izinleri").delete().eq("kullanici_id", kul.id);
    if (satirlar.length) {
      const { error } = await sb.from("modul_izinleri").insert(satirlar);
      if (error) { alert("Kaydedilemedi: " + error.message);
        $("form-kaydet").textContent = "Yetkileri Kaydet"; return; }
    }
    $("form-kaydet").textContent = "Yetkileri Kaydet";
    $("perde").classList.add("gizli");
  };
  $("perde").classList.remove("gizli");
}

/* ---------------- MODÜL EKLE ---------------- */
function modulEkleFormu() {
  $("form-baslik").textContent = "Yeni Modül";
  $("form-govde").innerHTML = `
    <div class="alan genis"><label>Modül Adı *</label><input id="m-ad" placeholder="Aidat Ödemeleri"></div>
    <div class="alan"><label>Hangi Kol *</label><select id="m-kol">
      <option value="">Ortak (ikisi de görür)</option>
      <option value="erkek">Erkek Kolu</option><option value="kadin">Kadın Kolu</option></select></div>
    <div class="alan"><label>Sorumlu Görev</label><select id="m-gorev">
      <option value="">Yok</option><option value="mudur">Müdür</option>
      <option value="ticaret">Ticaret</option><option value="sosyal">Sosyal</option>
      <option value="dergi">Dergi</option></select></div>
    <div class="alan genis"><label>Alanlar</label>
      <div id="m-alanlar"></div>
      <button class="btn ikincil kucuk" id="m-alan-ekle" style="margin-top:8px">+ Alan Ekle</button></div>`;
  $("form-kaydet").textContent = "Modülü Oluştur";
  const kap = $("m-alanlar");
  const alanSatiri = () => {
    const d = document.createElement("div");
    d.style.cssText = "display:flex;gap:6px;margin-bottom:6px";
    d.innerHTML = `<input placeholder="Alan adı (örn. Tutar)" class="m-etiket">
      <select class="m-tip" style="width:130px">
        <option value="metin">Metin</option><option value="para">Para</option>
        <option value="sayi">Sayı</option><option value="tarih">Tarih</option>
        <option value="uzun_metin">Uzun Metin</option></select>
      <button class="btn ikincil kucuk" style="white-space:nowrap">Sil</button>`;
    d.querySelector("button").onclick = () => d.remove();
    kap.appendChild(d);
  };
  ["Tarih","Açıklama","Tutar"].forEach(() => alanSatiri());
  [...kap.querySelectorAll(".m-etiket")].forEach((el,i) => el.value = ["Tarih","Açıklama","Tutar"][i]);
  [...kap.querySelectorAll(".m-tip")].forEach((el,i) => el.value = ["tarih","metin","para"][i]);
  $("m-alan-ekle").onclick = alanSatiri;

  $("form-kaydet").onclick = async () => {
    const ad = $("m-ad").value.trim();
    if (!ad) { alert("Modül adı gerekli."); return; }
    const kod = ad.toLowerCase()
      .replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i")
      .replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")
      + "_" + Math.random().toString(36).slice(2,5);

    $("form-kaydet").textContent = "Oluşturuluyor…";
    const { data: m, error } = await sb.from("moduller").insert({
      kod, ad, kol: $("m-kol").value || null,
      sahip_gorev: $("m-gorev").value || null, sira: 200
    }).select().single();
    if (error) { alert("Oluşturulamadı: " + error.message);
      $("form-kaydet").textContent = "Modülü Oluştur"; return; }

    const satirlar = [...kap.children].map((d, i) => {
      const et = d.querySelector(".m-etiket").value.trim();
      if (!et) return null;
      return { modul_id: m.id, etiket: et, tip: d.querySelector(".m-tip").value,
        sira: (i+1)*10, kod: et.toLowerCase()
          .replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i")
          .replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"") || ("alan"+i) };
    }).filter(Boolean);
    if (satirlar.length) await sb.from("modul_alanlari").insert(satirlar);

    $("form-kaydet").textContent = "Modülü Oluştur";
    $("perde").classList.add("gizli");
    await modulleriYukle(); yonetimAc();
  };
  $("perde").classList.remove("gizli");
}

</script>
</body>
</html>
