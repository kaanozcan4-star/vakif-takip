<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* =====================================================================
   AYARLAR — Supabase > Project Settings > Data API'den kopyala
   ===================================================================== */
const SUPABASE_URL      = "https://zfujfdzhymlrighxhebl.supabase.co";   // Semerkand Kurtkoy projesi
const SUPABASE_ANON_KEY = "sb_publishable_9kUSG4qWWfUI7M8MkQdpQw_LDza6AMj";    // publishable key (tarayıcıda güvenli)
/* ===================================================================== */

// "Beni hatırla" işaretliyse oturum tarayıcı kapanınca da kalır (localStorage),
// değilse sekme/tarayıcı kapanınca biter (sessionStorage).
const hatirlaDepo = {
  getItem: k => { try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } },
  setItem: (k, v) => { try {
    const kalici = localStorage.getItem("beni_hatirla") !== "0";
    (kalici ? localStorage : sessionStorage).setItem(k, v);
    (kalici ? sessionStorage : localStorage).removeItem(k);
  } catch {} },
  removeItem: k => { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} }
};
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storage: hatirlaDepo } });
const $  = id => document.getElementById(id);

const GOREV_AD = {baskan:"Başkan", mudur:"Müdür", ticaret:"Ticaret",
                  sosyal:"Sosyal", dergi:"Dergi", vekil:"Vekil"};
const KOL_AD   = {erkek:"Erkek Kolu", kadin:"Kadın Kolu"};

let ben = null, moduller = [], aktifModul = null, alanlar = [], kayitlar = [];
let yazabilir = false, silebilir = false, duzenlenen = null;

const paraYaz = n => "₺" + (Number(n)||0).toLocaleString("tr-TR",{maximumFractionDigits:2});
const tarihYaz = t => t ? new Date(t).toLocaleDateString("tr-TR") : "—";

/* ---------------- GİRİŞ ---------------- */
let kurulumModu = false;

(async () => {
  const { data } = await sb.rpc("kurulum_gerekli");
  if (data === true) {
    kurulumModu = true;
    $("ad-alani").classList.remove("gizli");
    $("kurulum-notu").classList.remove("gizli");
    $("giris-btn").textContent = "Kurulumu Tamamla";
  }
})();

$("giris-btn").onclick = async () => {
  const hata = $("giris-hata");
  hata.classList.add("gizli");
  const eposta = $("eposta").value.trim(), sifre = $("sifre").value;
  if (!eposta || !sifre) { hata.textContent = "E-posta ve şifre gerekli."; hata.classList.remove("gizli"); return; }

  if (kurulumModu) {
    if (sifre.length < 6) { hata.textContent = "Şifre en az 6 karakter olmalı."; hata.classList.remove("gizli"); return; }
    $("giris-btn").textContent = "Kuruluyor…";
    const { error: e1 } = await sb.auth.signUp({ email: eposta, password: sifre });
    if (e1) { $("giris-btn").textContent = "Kurulumu Tamamla";
      hata.textContent = "Kurulamadı: " + e1.message; hata.classList.remove("gizli"); return; }
    await sb.auth.signInWithPassword({ email: eposta, password: sifre });
    const { data: ok } = await sb.rpc("ilk_kullanici_kur", { p_ad: $("kurulum-ad").value.trim() });
    $("giris-btn").textContent = "Kurulumu Tamamla";
    if (ok !== true) {
      hata.textContent = "E-posta onayı bekleniyor olabilir. Supabase > Authentication > Sign In / Providers > 'Confirm email' kapalı olmalı.";
      hata.classList.remove("gizli"); return;
    }
    kurulumModu = false;
    baslat(); return;
  }

  $("giris-btn").textContent = "Giriş yapılıyor…";
  try { localStorage.setItem("beni_hatirla", $("beni-hatirla").checked ? "1" : "0"); } catch {}
  let girisEposta = eposta;
  if (!eposta.includes("@")) {
    const { data: bulunan } = await sb.rpc("kullanici_eposta", { p_kullanici_adi: eposta });
    girisEposta = bulunan || `${eposta.toLowerCase().trim()}@${GIRIS_ALANI}`;
  }
  const { error } = await sb.auth.signInWithPassword({ email: girisEposta, password: sifre });
  $("giris-btn").textContent = "Giriş Yap";
  if (error) {
    if (error.message?.includes("Failed to fetch") || error.status === 0 || error.name === "AuthRetryableFetchError") {
      hata.textContent = "Supabase sunucusuna ulaşılamıyor! Proje uyku modunda (Paused) olabilir. Supabase panelinden 'Restore' butonuna basın.";
    } else {
      hata.textContent = "Giriş başarısız: " + (error.message === "Invalid login credentials" ? "Kullanıcı adı veya şifre hatalı." : error.message);
    }
    hata.classList.remove("gizli");
  }
};
$("sifre").addEventListener("keydown", e => { if (e.key === "Enter") $("giris-btn").click(); });
$("cikis-btn").onclick = async () => { await sb.auth.signOut(); location.reload(); };
$("sifre-btn").onclick = () => sifremiDegistir();
try { $("beni-hatirla").checked = localStorage.getItem("beni_hatirla") !== "0"; } catch {}

sb.auth.onAuthStateChange((_e, oturum) => { if (oturum) baslat(); });
(async () => { const { data } = await sb.auth.getSession(); if (data.session) baslat(); })();

/* ---------------- BAŞLAT ---------------- */
async function baslat() {
  const { data: kul, error } = await sb.from("kullanicilar")
    .select("*").eq("id", (await sb.auth.getUser()).data.user.id).single();

  if (error || !kul) {
    $("giris-hata").textContent = "Hesabınız henüz yetkilendirilmemiş. Müdüre bildirin.";
    $("giris-hata").classList.remove("gizli");
    await sb.auth.signOut();
    return;
  }
  ben = kul;
  $("giris").classList.add("gizli");
  $("uygulama").classList.remove("gizli");
  $("kul-ad").textContent  = ben.ad_soyad;
  $("kul-rol").textContent = `${KOL_AD[ben.kol]} · ${GOREV_AD[ben.gorev]}`;
  await modulleriYukle();
}

async function modulleriYukle() {
  const { data } = await sb.from("moduller").select("*").eq("aktif", true).order("sira");
  moduller = data || [];
  const erkekM = moduller.filter(m => m.kol !== "kadin");
  const kadinM = moduller.filter(m => m.kol === "kadin");

  let html = "";
  if (erkekM.length) {
    html += `<div class="menu-baslik">Vakıf</div>` +
      erkekM.map(m => `<button data-id="${m.id}">${m.ad}</button>`).join("");
  }
  if (kadinM.length) {
    html += `<div class="menu-baslik">Kadın Kolu</div>` +
      kadinM.map(m => `<button data-id="${m.id}">${m.ad}</button>`).join("");
  }
  html += `<div class="menu-baslik">Genel</div><button data-id="talepler">Talepler</button>`;
  if (yonetici()) html += `<button data-id="yonetim">Modüller</button>`;
  if (tamYetkili()) html += `<div class="menu-baslik">Yönetici</div><button data-id="kullanicilar">Kullanıcılar</button>`;
  $("menu").innerHTML = html;

  $("menu").querySelectorAll("button").forEach(b => {
    b.onclick = () => b.dataset.id === "talepler" ? talepleriAc()
                    : b.dataset.id === "yonetim"  ? yonetimAc()
                    : b.dataset.id === "kullanicilar" ? kullanicilarAc()
                    : modulSec(b.dataset.id);
  });

  if (moduller.length) modulSec(moduller[0].id);
  else $("icerik").innerHTML = `<div class="bos">Görebileceğiniz modül yok. Müdürden yetki isteyin.</div>`;
}

/* ---------------- MODÜL ---------------- */
// Özel paneli olan modüller (kod'a göre) kendi ekranını açar, gerisi genel tablo
function modulSec(id) {
  const m = moduller.find(x => x.id === id);
  if (m?.kod === "kira") return kiraAc(m);
  if (m && BORC_KODLARI.includes(m.kod)) return borcAc(m);
  return modulAc(id);
}

async function modulAc(id) {
  aktifModul = moduller.find(m => m.id === id);
  if (!aktifModul) return;
  menuIsaretle(id);
  $("modul-ad").textContent = aktifModul.ad + (aktifModul.kol === "kadin" ? " — Kadın Kolu" : "");
  $("modul-aciklama").textContent = aktifModul.aciklama || "";
  $("icerik").innerHTML = `<div class="yukleniyor">Yükleniyor…</div>`;
  $("ara").classList.remove("gizli");

  const [{ data: y }, { data: s }, { data: al }, { data: kay }] = await Promise.all([
    sb.rpc("modul_yazabilir", { p_modul: id }),
    sb.rpc("modul_silebilir", { p_modul: id }),
    sb.from("modul_alanlari").select("*").eq("modul_id", id).order("sira"),
    sb.from("kayitlar").select("*").eq("modul_id", id).order("olusturuldu", { ascending: false })
  ]);

  yazabilir = !!y; silebilir = !!s; alanlar = al || []; kayitlar = kay || [];
  $("ekle-btn").textContent = yazabilir ? "+ Yeni Kayıt" : "+ Talep Oluştur";
  $("ekle-btn").classList.remove("gizli");
  $("ekle-btn").onclick = () => formAc(null);   // özel paneller bunu değiştirmiş olabilir
  ozetCiz();
  tabloCiz();
}

function menuIsaretle(id) {
  $("menu").querySelectorAll("button").forEach(b =>
    b.classList.toggle("aktif", b.dataset.id === id));
}

function ozetCiz() {
  const paraAlan = alanlar.filter(a => a.tip === "para");
  if (!paraAlan.length || !kayitlar.length) { $("ozet").classList.add("gizli"); return; }
  let html = `<div><div class="k">Kayıt Sayısı</div><div class="v">${kayitlar.length}</div></div>`;
  paraAlan.forEach(a => {
    const t = kayitlar.reduce((s, k) => s + (Number(k.veri[a.kod]) || 0), 0);
    html += `<div><div class="k">${a.etiket} Toplam</div><div class="v">${paraYaz(t)}</div></div>`;
  });
  const b = alanlar.find(a => a.kod === "borc"), o = alanlar.find(a => a.kod === "odenen");
  if (b && o) {
    const kalan = kayitlar.reduce((s, k) =>
      s + ((Number(k.veri.borc) || 0) - (Number(k.veri.odenen) || 0)), 0);
    html += `<div><div class="k">Kalan</div><div class="v" style="color:var(--kirmizi)">${paraYaz(kalan)}</div></div>`;
  }
  $("ozet").innerHTML = html;
  $("ozet").classList.remove("gizli");
}

function hucreYaz(alan, deger) {
  if (deger === null || deger === undefined || deger === "") return "—";
  if (alan.tip === "para")       return paraYaz(deger);
  if (alan.tip === "tarih")      return tarihYaz(deger);
  if (alan.tip === "sayi")       return Number(deger).toLocaleString("tr-TR");
  if (alan.tip === "evet_hayir") return deger ? "Evet" : "Hayır";
  if (alan.kod === "durum") {
    const s = {"Açık":"acik","Kısmi Ödendi":"kismi","Kapandı":"kapali"}[deger] || "bekle";
    return `<span class="rozet ${s}">${deger}</span>`;
  }
  return String(deger);
}

function tabloCiz() {
  const q = $("ara").value.toLowerCase().trim();
  const liste = q ? kayitlar.filter(k => JSON.stringify(k.veri).toLowerCase().includes(q)) : kayitlar;

  if (!liste.length) {
    $("icerik").innerHTML = `<div class="tablo-kutu"><div class="bos">${
      q ? "Aramaya uyan kayıt yok." : "Bu modülde henüz kayıt yok."}</div></div>`;
    return;
  }
  const gosterilecek = alanlar.slice(0, 7);
  $("icerik").innerHTML = `<div class="tablo-kutu"><table>
    <thead><tr>${gosterilecek.map(a =>
      `<th class="${a.tip === "para" || a.tip === "sayi" ? "sag" : ""}">${a.etiket}</th>`).join("")}
      <th class="sag">İşlem</th></tr></thead>
    <tbody>${liste.map(k => `<tr>${gosterilecek.map(a =>
      `<td class="${a.tip === "para" || a.tip === "sayi" ? "sag" : ""}">${hucreYaz(a, k.veri[a.kod])}</td>`).join("")}
      <td class="sag">
        ${yazabilir ? `<button class="btn ikincil kucuk" data-duzenle="${k.id}">Düzenle</button>` : ""}
        ${silebilir ? `<button class="btn tehlike kucuk" data-sil="${k.id}">Sil</button>` : ""}
        ${!yazabilir && !silebilir ? "—" : ""}
      </td></tr>`).join("")}</tbody></table></div>`;

  $("icerik").querySelectorAll("[data-duzenle]").forEach(b =>
    b.onclick = () => formAc(kayitlar.find(k => k.id === b.dataset.duzenle)));
  $("icerik").querySelectorAll("[data-sil]").forEach(b =>
    b.onclick = () => kayitSil(b.dataset.sil));
}

$("ara").oninput = () => {
  if (!aktifModul || aktifModul.kod === "kira") return;
  if (BORC_KODLARI.includes(aktifModul.kod)) return borcCiz();
  tabloCiz();
};

/* ---------------- FORM ---------------- */
$("ekle-btn").onclick = () => formAc(null);
$("form-kapat").onclick = $("form-iptal").onclick = () => $("perde").classList.add("gizli");

function formAc(kayit) {
  duzenlenen = kayit;
  borcPencereSifirla();
  $("form-kaydet").onclick = kayitKaydet;
  $("form-baslik").textContent = kayit ? "Kaydı Düzenle"
    : (yazabilir ? "Yeni Kayıt" : "Talep Oluştur");
  $("form-govde").innerHTML = alanlar.map(a => {
    const d = kayit ? (kayit.veri[a.kod] ?? "") : "";
    const genis = (a.tip === "uzun_metin" || a.kod === "aciklama") ? "genis" : "";
    let girdi;
    if (a.tip === "uzun_metin")
      girdi = `<textarea rows="3" data-kod="${a.kod}">${d}</textarea>`;
    else if (a.tip === "secim")
      girdi = `<select data-kod="${a.kod}"><option value="">— seçiniz —</option>${
        (a.secenekler || []).map(s =>
          `<option ${s === d ? "selected" : ""}>${s}</option>`).join("")}</select>`;
    else if (a.tip === "evet_hayir")
      girdi = `<select data-kod="${a.kod}"><option value="">—</option>
        <option value="1" ${d ? "selected" : ""}>Evet</option>
        <option value="0" ${d === false ? "selected" : ""}>Hayır</option></select>`;
    else {
      const t = a.tip === "tarih" ? "date" : (a.tip === "para" || a.tip === "sayi") ? "number" : "text";
      girdi = `<input type="${t}" ${t === "number" ? 'step="0.01"' : ""} data-kod="${a.kod}" value="${d}">`;
    }
    return `<div class="alan ${genis}">
      <label>${a.etiket}${a.zorunlu ? ' <span style="color:var(--kirmizi)">*</span>' : ""}</label>
      ${girdi}</div>`;
  }).join("");
  $("form-kaydet").textContent = yazabilir ? "Kaydet" : "Talep Gönder";
  $("perde").classList.remove("gizli");
}

async function kayitKaydet() {
  const veri = {};
  let eksik = null;
  $("form-govde").querySelectorAll("[data-kod]").forEach(el => {
    const a = alanlar.find(x => x.kod === el.dataset.kod);
    let v = el.value;
    if (a.zorunlu && !v) eksik = a.etiket;
    if (v === "") { veri[a.kod] = null; return; }
    if (a.tip === "para" || a.tip === "sayi") v = Number(v);
    if (a.tip === "evet_hayir") v = v === "1";
    veri[a.kod] = v;
  });
  if (eksik) { alert(`"${eksik}" alanı zorunlu.`); return; }

  $("form-kaydet").textContent = "Kaydediliyor…";
  const kol = aktifModul.kol || ben.kol;
  const baslik = veri.aciklama || veri.ad_soyad || veri.baslik || null;
  let hata;

  if (!yazabilir) {
    ({ error: hata } = await sb.from("talepler").insert({
      modul_id: aktifModul.id, tip: duzenlenen ? "duzeltme" : "ekleme",
      kayit_id: duzenlenen?.id || null, veri, olusturan: ben.id
    }));
  } else if (duzenlenen) {
    ({ error: hata } = await sb.from("kayitlar")
      .update({ veri, baslik }).eq("id", duzenlenen.id));
  } else {
    ({ error: hata } = await sb.from("kayitlar").insert({
      modul_id: aktifModul.id, kol, veri, baslik, olusturan: ben.id
    }));
  }

  $("form-kaydet").textContent = yazabilir ? "Kaydet" : "Talep Gönder";
  if (hata) { alert("Kaydedilemedi: " + hata.message); return; }
  $("perde").classList.add("gizli");
  yazabilir ? modulAc(aktifModul.id) : alert("Talebiniz gönderildi. Yetkili onayına düştü.");
}

async function kayitSil(id) {
  if (!confirm("Bu kayıt kalıcı olarak silinecek. Emin misiniz?")) return;
  const { error } = await sb.from("kayitlar").delete().eq("id", id);
  if (error) { alert("Silinemedi: " + error.message); return; }
  modulAc(aktifModul.id);
}

/* ---------------- TALEPLER ---------------- */
async function talepleriAc() {
  aktifModul = null;
  menuIsaretle("talepler");
  $("modul-ad").textContent = "Talepler";
  $("modul-aciklama").textContent = "Yetkisi olmayan kullanıcıların açtığı kayıt talepleri";
  $("ozet").classList.add("gizli");
  $("ekle-btn").classList.add("gizli");
  $("ara").classList.add("gizli");
  $("icerik").innerHTML = `<div class="yukleniyor">Yükleniyor…</div>`;

  const { data } = await sb.from("talepler")
    .select("*, moduller(ad), kullanicilar!talepler_olusturan_fkey(ad_soyad)")
    .order("olusturuldu", { ascending: false });

  if (!data?.length) {
    $("icerik").innerHTML = `<div class="tablo-kutu"><div class="bos">Bekleyen talep yok.</div></div>`;
    return;
  }
  const durumSinif = { beklemede:"bekle", onaylandi:"onay", reddedildi:"red" };
  const durumAd    = { beklemede:"Beklemede", onaylandi:"Onaylandı", reddedildi:"Reddedildi" };

  $("icerik").innerHTML = `<div class="tablo-kutu"><table>
    <thead><tr><th>Tarih</th><th>Modül</th><th>Talep Eden</th><th>Tip</th>
    <th>İçerik</th><th>Durum</th><th class="sag">İşlem</th></tr></thead>
    <tbody>${data.map(t => `<tr>
      <td>${tarihYaz(t.olusturuldu)}</td>
      <td>${t.moduller?.ad || "—"}</td>
      <td>${t.kullanicilar?.ad_soyad || "—"}</td>
      <td>${t.tip === "ekleme" ? "Ekleme" : t.tip === "duzeltme" ? "Düzeltme" : "Silme"}</td>
      <td style="max-width:260px;font-size:12px;color:var(--soluk)">${
        Object.entries(t.veri).filter(([,v]) => v).slice(0,3)
          .map(([k,v]) => `${k}: ${v}`).join(" · ") || "—"}</td>
      <td><span class="rozet ${durumSinif[t.durum]}">${durumAd[t.durum]}</span></td>
      <td class="sag">${t.durum === "beklemede"
        ? `<button class="btn kucuk" data-onay="${t.id}">Onayla</button>
           <button class="btn tehlike kucuk" data-red="${t.id}">Reddet</button>`
        : "—"}</td></tr>`).join("")}</tbody></table></div>`;

  $("icerik").querySelectorAll("[data-onay]").forEach(b =>
    b.onclick = () => talepKarar(data.find(t => t.id === b.dataset.onay), true));
  $("icerik").querySelectorAll("[data-red]").forEach(b =>
    b.onclick = () => talepKarar(data.find(t => t.id === b.dataset.red), false));
}

async function talepKarar(talep, onay) {
  if (onay && talep.tip === "ekleme") {
    const m = moduller.find(x => x.id === talep.modul_id);
    const { error } = await sb.from("kayitlar").insert({
      modul_id: talep.modul_id, kol: talep.veri.kol || m?.kol || ben.kol,
      veri: talep.veri, baslik: talep.veri.baslik || talep.veri.aciklama || null, olusturan: talep.olusturan
    });
    if (error) { alert("Kayıt oluşturulamadı: " + error.message); return; }
  }
  if (onay && talep.tip === "duzeltme" && talep.kayit_id) {
    await sb.from("kayitlar").update({ veri: talep.veri }).eq("id", talep.kayit_id);
  }
  if (onay && talep.tip === "silme" && talep.kayit_id) {
    await sb.from("kayitlar").delete().eq("id", talep.kayit_id);
  }
  await sb.from("talepler").update({
    durum: onay ? "onaylandi" : "reddedildi",
    karar_veren: ben.id, karar_tarihi: new Date().toISOString()
  }).eq("id", talep.id);
  talepleriAc();
}

/* =====================================================================
   KİRA PANELİ — dergah kiraları, vade çubuğu, ödeme kaydı
   Veri: kayitlar tablosunda, kira modülünde.
     veri.tip = 'yer'   → dergah (ad, adres, tutar, vade_gunu, sira, aktif)
     veri.tip = 'odeme' → ödeme (yer_id, donem 'YYYY-MM', tarih, tutar, odeyen, not_metni)
   ===================================================================== */
let kiraModul = null, kiraYerler = [], kiraOdemeler = [];
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const kacir = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const donemYaz = d => { if (!d) return "—"; const [y, a] = d.split("-"); return `${AYLAR[Number(a)-1] || a} ${y}`; };
const donemStr = t => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}`;
const donemKaydir = (d, n) => { const [y, a] = d.split("-").map(Number); return donemStr(new Date(y, a-1+n, 1)); };
const vadeTarihi = (d, gun) => { const [y, a] = d.split("-").map(Number); return new Date(y, a-1, gun || 5); };

function kiraDurum(yer) {
  const bugun = new Date(); bugun.setHours(0,0,0,0);
  const gun = Number(yer.veri.vade_gunu) || 5;
  const buDonem = donemStr(bugun);
  const buAyOdendi = kiraOdemeler.some(o => o.veri.yer_id === yer.id && o.veri.donem === buDonem);
  const hedef = buAyOdendi ? donemKaydir(buDonem, 1) : buDonem;
  const vade = vadeTarihi(hedef, gun);
  const bas = vadeTarihi(donemKaydir(hedef, -1), gun);
  const pct = Math.max(0, Math.min(100, (bugun - bas) / (vade - bas) * 100));
  const kalan = Math.round((vade - bugun) / 86400000);
  let sinif, gunMetni;
  if (buAyOdendi)     { sinif = "odendi";  gunMetni = kalan === 0 ? "Bugün" : `${kalan} gün kaldı`; }
  else if (kalan < 0) { sinif = "gecikti"; gunMetni = `${-kalan} gün gecikti`; }
  else if (kalan === 0){ sinif = "gecikti"; gunMetni = "BUGÜN son gün"; }
  else                { sinif = pct >= 75 ? "uyari" : ""; gunMetni = `${kalan} gün kaldı`; }
  return { buDonem, buAyOdendi, hedef, vade, pct: buAyOdendi ? pct : Math.max(pct, 3), kalan, sinif, gunMetni };
}

async function kiraAc(m) {
  aktifModul = m; kiraModul = m;
  menuIsaretle(m.id);
  $("modul-ad").textContent = m.ad;
  $("modul-aciklama").textContent = m.aciklama || "Dergah kiraları — her ayın 5'i";
  $("ara").classList.add("gizli");
  $("ozet").classList.add("gizli");
  $("icerik").innerHTML = `<div class="yukleniyor">Yükleniyor…</div>`;

  const [{ data: y }, { data: s }, { data: kay, error }] = await Promise.all([
    sb.rpc("modul_yazabilir", { p_modul: m.id }),
    sb.rpc("modul_silebilir", { p_modul: m.id }),
    sb.from("kayitlar").select("*, kullanicilar!kayitlar_olusturan_fkey(ad_soyad)")
      .eq("modul_id", m.id).order("olusturuldu", { ascending: false })
  ]);
  if (error) { $("icerik").innerHTML = `<div class="bos">Yüklenemedi: ${kacir(error.message)}</div>`; return; }
  yazabilir = !!y; silebilir = !!s;
  const hepsi = kay || [];
  kiraYerler = hepsi.filter(k => k.veri.tip === "yer")
    .sort((a, b) => (Number(a.veri.sira)||99) - (Number(b.veri.sira)||99) || a.veri.ad.localeCompare(b.veri.ad, "tr"));
  kiraOdemeler = hepsi.filter(k => k.veri.tip === "odeme")
    .sort((a, b) => (b.veri.donem||"").localeCompare(a.veri.donem||"") || (b.veri.tarih||"").localeCompare(a.veri.tarih||""));

  $("ekle-btn").textContent = yazabilir ? "+ Ödeme Kaydet" : "+ Ödeme Talebi";
  $("ekle-btn").classList.remove("gizli");
  $("ekle-btn").onclick = () => kiraOdemeFormu(null, null);
  kiraCiz();
}

function kiraCiz() {
  const aktifYerler = kiraYerler.filter(y => y.veri.aktif !== false);
  if (!aktifYerler.length) {
    $("icerik").innerHTML = `<div class="tablo-kutu"><div class="bos">Henüz dergah tanımlı değil.
      ${yazabilir ? `<br><br><button class="btn" id="yer-ekle">+ Dergah Ekle</button>` : ""}</div></div>`;
    if (yazabilir) $("yer-ekle").onclick = () => kiraYerFormu(null);
    return;
  }
  const durumlar = aktifYerler.map(y => ({ yer: y, d: kiraDurum(y) }));

  // --- özet şeridi
  const toplamKira = aktifYerler.reduce((s, y) => s + (Number(y.veri.tutar) || 0), 0);
  const odenen = durumlar.filter(x => x.d.buAyOdendi).length;
  const geciken = durumlar.filter(x => x.d.sinif === "gecikti").length;
  $("ozet").innerHTML = `
    <div><div class="k">Dergah</div><div class="v">${aktifYerler.length}</div></div>
    <div><div class="k">Aylık Toplam Kira</div><div class="v">${toplamKira ? paraYaz(toplamKira) : "—"}</div></div>
    <div><div class="k">Bu Ay Ödenen</div><div class="v" style="color:#2E9E5B">${odenen} / ${aktifYerler.length}</div></div>
    <div><div class="k">Geciken</div><div class="v" style="color:${geciken ? "var(--kirmizi)" : "inherit"}">${geciken}</div></div>`;
  $("ozet").classList.remove("gizli");

  // --- kartlar
  const kartlar = durumlar.map(({ yer, d }) => {
    const v = yer.veri;
    const son = kiraOdemeler.find(o => o.veri.yer_id === yer.id);
    return `<div class="kira-kart ${d.sinif}">
      <h3>${kacir(v.ad)}</h3>
      ${v.adres ? `<div class="adres">${kacir(v.adres)}</div>` : ""}
      <div class="tutar">${v.tutar ? paraYaz(v.tutar) : `<span style="color:var(--soluk);font-size:14px">Tutar girilmedi</span>`}<small>/ ay · her ayın ${v.vade_gunu || 5}'i</small></div>
      <div class="cubuk"><div style="width:${d.pct.toFixed(0)}%"></div></div>
      <div class="kira-durum">
        <span>${d.buAyOdendi ? `✓ ${donemYaz(d.buDonem)} ödendi` : `${donemYaz(d.hedef)} kirası`}</span>
        <span class="gun">${d.gunMetni}</span>
      </div>
      <div style="font-size:12px;color:var(--soluk)">Vade: ${tarihYaz(d.vade)}</div>
      ${v.not_metni ? `<div class="kira-not">⚠ ${kacir(v.not_metni)}</div>` : ""}
      <div class="kira-son">${son
        ? `Son ödeme: <b>${donemYaz(son.veri.donem)}</b> · ${tarihYaz(son.veri.tarih)} · <b>${kacir(son.veri.odeyen)}</b>${son.veri.tutar ? " · " + paraYaz(son.veri.tutar) : ""}`
        : "Henüz ödeme kaydı yok"}</div>
      <div class="islem">
        <button class="btn kucuk" data-ode="${yer.id}">${yazabilir ? "Ödeme Kaydet" : "Ödeme Talebi"}</button>
        ${yazabilir ? `<button class="btn ikincil kucuk" data-yer="${yer.id}">Düzenle</button>` : ""}
      </div>
    </div>`;
  }).join("");

  // --- 12 aylık tablo
  const bugun = new Date();
  const donemler = Array.from({ length: 12 }, (_, i) => donemKaydir(donemStr(bugun), -i));
  const buDonem = donemStr(bugun);
  const gecmis = `<div class="tablo-kutu"><table>
    <thead><tr><th>Dönem</th>${aktifYerler.map(y => `<th>${kacir(y.veri.ad)}</th>`).join("")}</tr></thead>
    <tbody>${donemler.map(dn => `<tr><td><b>${donemYaz(dn)}</b></td>${aktifYerler.map(y => {
      const o = kiraOdemeler.find(x => x.veri.yer_id === y.id && x.veri.donem === dn);
      if (o) return `<td><span class="tik">✓</span> ${kacir(o.veri.odeyen)}<span class="hucre-alt">${tarihYaz(o.veri.tarih)}${o.veri.tutar ? " · " + paraYaz(o.veri.tutar) : ""}</span></td>`;
      if (dn === buDonem) { const d = kiraDurum(y); return `<td><span class="${d.sinif === "gecikti" ? "eksik" : ""}" style="${d.sinif !== "gecikti" ? "color:#8A6410;font-weight:600" : ""}">${d.sinif === "gecikti" ? "Gecikti" : "Bekliyor"}</span></td>`; }
      return `<td><span class="eksik">Ödenmedi</span></td>`;
    }).join("")}</tr>`).join("")}</tbody></table></div>`;

  // --- tüm ödemeler
  const yerAd = id => kiraYerler.find(y => y.id === id)?.veri.ad || "—";
  const liste = kiraOdemeler.length ? `<div class="tablo-kutu"><table>
    <thead><tr><th>Dönem</th><th>Dergah</th><th>Ödeme Tarihi</th><th class="sag">Tutar</th><th>Ödeyen</th><th>Kaydeden</th><th>Not</th><th class="sag">İşlem</th></tr></thead>
    <tbody>${kiraOdemeler.map(o => `<tr>
      <td>${donemYaz(o.veri.donem)}</td><td>${kacir(yerAd(o.veri.yer_id))}</td><td>${tarihYaz(o.veri.tarih)}</td>
      <td class="sag">${o.veri.tutar ? paraYaz(o.veri.tutar) : "—"}</td>
      <td><b>${kacir(o.veri.odeyen)}</b></td>
      <td>${kacir(o.kullanicilar?.ad_soyad || "—")}<span class="hucre-alt">${tarihYaz(o.olusturuldu)}</span></td>
      <td style="font-size:12px;color:var(--soluk)">${kacir(o.veri.not_metni || "")}</td>
      <td class="sag">
        ${yazabilir ? `<button class="btn ikincil kucuk" data-odeme-duzenle="${o.id}">Düzenle</button>` : ""}
        ${silebilir ? `<button class="btn tehlike kucuk" data-odeme-sil="${o.id}">Sil</button>` : ""}
        ${!yazabilir && !silebilir ? "—" : ""}
      </td></tr>`).join("")}</tbody></table></div>`
    : `<div class="tablo-kutu"><div class="bos">Henüz ödeme kaydı yok.</div></div>`;

  $("icerik").innerHTML = `
    <div class="kira-bolum">Dergahlar ve Vade Durumu</div>
    <div class="kira-kartlar">${kartlar}</div>
    ${yazabilir ? `<button class="btn ikincil kucuk" id="yer-ekle" style="margin-top:-10px;margin-bottom:8px">+ Dergah Ekle</button>` : ""}
    <div class="kira-bolum">Son 12 Ay — Kim Ödedi</div>${gecmis}
    <div class="kira-bolum">Tüm Ödeme Kayıtları</div>${liste}`;

  $("icerik").querySelectorAll("[data-ode]").forEach(b =>
    b.onclick = () => kiraOdemeFormu(kiraYerler.find(y => y.id === b.dataset.ode), null));
  $("icerik").querySelectorAll("[data-yer]").forEach(b =>
    b.onclick = () => kiraYerFormu(kiraYerler.find(y => y.id === b.dataset.yer)));
  $("icerik").querySelectorAll("[data-odeme-duzenle]").forEach(b =>
    b.onclick = () => { const o = kiraOdemeler.find(x => x.id === b.dataset.odemeDuzenle);
      kiraOdemeFormu(kiraYerler.find(y => y.id === o.veri.yer_id), o); });
  $("icerik").querySelectorAll("[data-odeme-sil]").forEach(b => b.onclick = () => kiraSil(b.dataset.odemeSil, "ödeme"));
  const ye = $("yer-ekle"); if (ye) ye.onclick = () => kiraYerFormu(null);
}

/* --- ödeme formu (yeni / düzenle / talep) --- */
function kiraOdemeFormu(yer, odeme) {
  borcPencereSifirla();
  const aktifYerler = kiraYerler.filter(y => y.veri.aktif !== false);
  if (!aktifYerler.length) { alert("Önce dergah tanımlayın."); return; }
  const v = odeme?.veri || {};
  const secili = yer?.id || v.yer_id || aktifYerler[0].id;
  const bugun = new Date();
  $("form-baslik").textContent = odeme ? "Ödemeyi Düzenle" : (yazabilir ? "Kira Ödemesi Kaydet" : "Kira Ödeme Talebi");
  $("form-govde").innerHTML = `
    <div class="alan genis"><label>Dergah <span style="color:var(--kirmizi)">*</span></label>
      <select id="ko-yer">${aktifYerler.map(y => `<option value="${y.id}" ${y.id === secili ? "selected" : ""}>${kacir(y.veri.ad)}</option>`).join("")}</select></div>
    <div class="alan"><label>Hangi ayın kirası <span style="color:var(--kirmizi)">*</span></label>
      <input type="month" id="ko-donem" value="${v.donem || donemStr(bugun)}"></div>
    <div class="alan"><label>Ödeme tarihi <span style="color:var(--kirmizi)">*</span></label>
      <input type="date" id="ko-tarih" value="${v.tarih || `${donemStr(bugun)}-${String(bugun.getDate()).padStart(2,"0")}`}"></div>
    <div class="alan"><label>Tutar (₺)</label>
      <input type="number" step="0.01" id="ko-tutar" value="${v.tutar ?? ""}" placeholder="boş bırakılırsa dergahın kirası"></div>
    <div class="alan"><label>Kim ödedi <span style="color:var(--kirmizi)">*</span></label>
      <input type="text" id="ko-odeyen" value="${kacir(v.odeyen ?? ben.ad_soyad)}"></div>
    <div class="alan genis"><label>Not</label><textarea rows="2" id="ko-not">${kacir(v.not_metni || "")}</textarea></div>`;
  $("form-kaydet").textContent = yazabilir ? "Kaydet" : "Talep Gönder";
  $("form-kaydet").onclick = async () => {
    const y = kiraYerler.find(x => x.id === $("ko-yer").value);
    const donem = $("ko-donem").value, tarih = $("ko-tarih").value, odeyen = $("ko-odeyen").value.trim();
    if (!y || !donem || !tarih || !odeyen) { alert("Dergah, dönem, tarih ve ödeyen zorunlu."); return; }
    const tutarStr = $("ko-tutar").value;
    const veri = { tip: "odeme", yer_id: y.id, donem, tarih, odeyen,
      tutar: tutarStr !== "" ? Number(tutarStr) : (y.veri.tutar ?? null),
      not_metni: $("ko-not").value.trim() || null };
    const baslik = `${y.veri.ad} — ${donem}`;
    if (!odeme) {
      const cift = kiraOdemeler.find(o => o.veri.yer_id === y.id && o.veri.donem === donem);
      if (cift && !confirm(`${y.veri.ad} için ${donemYaz(donem)} kirası zaten kayıtlı (${cift.veri.odeyen}). Yine de ekleyeyim mi?`)) return;
    }
    $("form-kaydet").textContent = "Kaydediliyor…";
    let hata;
    if (!yazabilir) {
      ({ error: hata } = await sb.from("talepler").insert({
        modul_id: kiraModul.id, tip: "ekleme", veri: { ...veri, kol: y.kol, baslik }, olusturan: ben.id }));
    } else if (odeme) {
      ({ error: hata } = await sb.from("kayitlar").update({ veri, baslik, kol: y.kol }).eq("id", odeme.id));
    } else {
      ({ error: hata } = await sb.from("kayitlar").insert({
        modul_id: kiraModul.id, kol: y.kol, veri, baslik, olusturan: ben.id }));
    }
    $("form-kaydet").textContent = "Kaydet";
    if (hata) { alert("Kaydedilemedi: " + hata.message); return; }
    $("perde").classList.add("gizli");
    if (!yazabilir) { alert("Talebiniz gönderildi. Yetkili onayına düştü."); return; }
    kiraAc(kiraModul);
  };
  $("perde").classList.remove("gizli");
}

/* --- dergah formu (yeni / düzenle) --- */
function kiraYerFormu(yer) {
  borcPencereSifirla();
  const v = yer?.veri || {};
  const kolSecilebilir = tamYetkili();
  $("form-baslik").textContent = yer ? "Dergahı Düzenle" : "Yeni Dergah";
  $("form-govde").innerHTML = `
    <div class="alan genis"><label>Dergah adı <span style="color:var(--kirmizi)">*</span></label>
      <input type="text" id="ky-ad" value="${kacir(v.ad || "")}"></div>
    <div class="alan genis"><label>Adres / semt</label><input type="text" id="ky-adres" value="${kacir(v.adres || "")}"></div>
    <div class="alan"><label>Aylık kira (₺)</label><input type="number" step="0.01" id="ky-tutar" value="${v.tutar ?? ""}"></div>
    <div class="alan"><label>Ödeme günü (ayın kaçı)</label><input type="number" min="1" max="28" id="ky-gun" value="${v.vade_gunu || 5}"></div>
    <div class="alan"><label>Kol</label>
      <select id="ky-kol" ${kolSecilebilir ? "" : "disabled"}>
        <option value="erkek" ${(yer?.kol || ben.kol) === "erkek" ? "selected" : ""}>Erkek Kolu</option>
        <option value="kadin" ${(yer?.kol || ben.kol) === "kadin" ? "selected" : ""}>Kadın Kolu</option></select></div>
    <div class="alan"><label>Durum</label>
      <select id="ky-aktif"><option value="1" ${v.aktif !== false ? "selected" : ""}>Takip ediliyor</option>
        <option value="0" ${v.aktif === false ? "selected" : ""}>Pasif (artık kira yok)</option></select></div>
    <div class="alan genis"><label>Not (kartta uyarı olarak görünür)</label>
      <input type="text" id="ky-not" value="${kacir(v.not_metni || "")}" placeholder="örn. Zam dönemi geldi"></div>`;
  $("form-kaydet").textContent = "Kaydet";
  $("form-kaydet").onclick = async () => {
    const ad = $("ky-ad").value.trim();
    if (!ad) { alert("Dergah adı zorunlu."); return; }
    const tutarStr = $("ky-tutar").value;
    const veri = { tip: "yer", ad, adres: $("ky-adres").value.trim(),
      tutar: tutarStr !== "" ? Number(tutarStr) : null,
      vade_gunu: Number($("ky-gun").value) || 5,
      sira: v.sira ?? (kiraYerler.length + 1), aktif: $("ky-aktif").value === "1",
      not_metni: $("ky-not").value.trim() || null };
    const kol = kolSecilebilir ? $("ky-kol").value : ben.kol;
    $("form-kaydet").textContent = "Kaydediliyor…";
    const { error } = yer
      ? await sb.from("kayitlar").update({ veri, baslik: ad, kol }).eq("id", yer.id)
      : await sb.from("kayitlar").insert({ modul_id: kiraModul.id, kol, veri, baslik: ad, olusturan: ben.id });
    $("form-kaydet").textContent = "Kaydet";
    if (error) { alert("Kaydedilemedi: " + error.message); return; }
    $("perde").classList.add("gizli");
    kiraAc(kiraModul);
  };
  $("perde").classList.remove("gizli");
}

async function kiraSil(id, ne) {
  if (!confirm(`Bu ${ne} kaydı kalıcı olarak silinecek. Emin misiniz?`)) return;
  const { error } = await sb.from("kayitlar").delete().eq("id", id);
  if (error) { alert("Silinemedi: " + error.message); return; }
  kiraAc(kiraModul);
}

/* =====================================================================
   BORÇ / ALACAK DEFTERİ — kimden ne alındı (TL, altın cinsi, döviz, çek),
   vade, ve her borcun altında geri ödemeler (kim ödedi, ne ile, ne zaman)
   Veri: kayitlar tablosunda, borclar / k_borclar modüllerinde.
     veri.tip = 'borc'  → borç veya alacak kaydı
     veri.tip = 'odeme' → o borca yapılan geri ödeme (borc_id)
   ===================================================================== */
const BORC_KODLARI = ["borclar", "k_borclar"];
const KALEMLER = { tl:"Nakit TL", altin:"Altın", usd:"Dolar (USD)", eur:"Euro (EUR)", cek:"Çek", senet:"Senet", esya:"Eşya / Mal" };
const ALTIN_CINSLERI = ["Çeyrek","Yarım","Tam","Ata","Cumhuriyet","Reşat","Hamit","Gremse","İkibuçuk","Beşli","Gram (24 ayar)","Gram (22 ayar)","Bilezik (gram)","Diğer"];
// Anlık kur — finans.truncgil.com (ücretsiz, anahtarsız). Satış fiyatı kullanılır: borç altınsa geri almak için ödenecek fiyat.
const KUR_ANAHTAR = { "Çeyrek":"CEYREKALTIN","Yarım":"YARIMALTIN","Tam":"TAMALTIN","Ata":"ATAALTIN","Cumhuriyet":"CUMHURIYETALTINI",
  "Reşat":"RESATALTIN","Hamit":"HAMITALTIN","Gremse":"GREMSEALTIN","İkibuçuk":"IKIBUCUKALTIN","Beşli":"BESLIALTIN",
  "Gram (24 ayar)":"GRA","Gram (22 ayar)":"YIA","Bilezik (gram)":"YIA", usd:"USD", eur:"EUR" };
let canliKur = null;   // { veri:{...}, zaman:"...", alindi: Date }
async function kurCek(zorla) {
  if (!zorla && canliKur && Date.now() - canliKur.alindi < 10 * 60 * 1000) return canliKur;
  try {
    const r = await fetch("https://finans.truncgil.com/v4/today.json", { cache: "no-store" });
    const d = await r.json();
    canliKur = { veri: d, zaman: d.Update_Date || "", alindi: Date.now(), kaynak: "truncgil" };
  } catch (e) {
    try {   // yedek: sadece dolar / euro
      const r = await fetch("https://open.er-api.com/v6/latest/USD");
      const d = await r.json(); const usd = d.rates?.TRY, eur = usd / d.rates?.EUR;
      canliKur = { veri: { USD: { Selling: usd }, EUR: { Selling: eur } }, zaman: d.time_last_update_utc || "", alindi: Date.now(), kaynak: "er-api" };
    } catch (e2) { canliKur = null; }
  }
  return canliKur;
}
// kalem: 'altin' | 'usd' | 'eur' ; cins: altın cinsi
function canliBirimKur(kalem, cins) {
  if (!canliKur) return null;
  const k = kalem === "altin" ? KUR_ANAHTAR[cins] : KUR_ANAHTAR[kalem];
  const v = k && canliKur.veri[k];
  const f = v && Number(v.Selling ?? v.Satış ?? v.satis);
  return f && isFinite(f) && f > 0 ? f : null;
}
const kurZamanYaz = () => canliKur?.zaman ? ` · ${canliKur.zaman.slice(0, 16).replace("T", " ")}` : "";
const YONTEMLER = { nakit:"Nakit", havale:"Havale / EFT", altin:"Altın", usd:"Dolar (USD)", eur:"Euro (EUR)", mahsup:"Mahsup (gelirden düşüldü)", diger:"Diğer" };
let borcModul = null, borcListe = [], borcOdemeler = [], borcFiltre = "tumu";

// Eski (genel tablo) kayıtları yeni yapıya çevir — veritabanı değişmez, sadece ekranda
function borcNormalize(k) {
  const v = k.veri || {};
  if (v.tip) return k;
  return { ...k, veri: {
    tip:"borc", yon:"borc", karsi_taraf: v.aciklama || k.baslik || "—", tarih: v.tarih,
    kalem: (v.para_birimi || "TL").toLowerCase() === "altin" ? "altin" : (v.para_birimi || "TL").toLowerCase(),
    miktar: v.toplam_birim ?? null, kur: v.kur ?? null, tutar_tl: Number(v.borc) || 0,
    vade_tarihi: v.vade_tarihi, aciklama: v.aciklama, not_metni: v.not_metni, _eski_odenen: Number(v.odenen) || 0 } };
}

function borcHesap(b) {
  const v = b.veri;
  const od = borcOdemeler.filter(o => o.veri.borc_id === b.id);
  const odenen = od.reduce((s, o) => s + (Number(o.veri.tutar_tl) || 0), 0) + (v._eski_odenen || 0);
  const kalan = Math.max(0, (Number(v.tutar_tl) || 0) - odenen);
  let miktarOdenen = null, miktarKalan = null;
  if (v.kalem === "altin" && v.miktar) {
    miktarOdenen = od.filter(o => o.veri.yontem === "altin" && o.veri.altin_cinsi === v.altin_cinsi)
      .reduce((s, o) => s + (Number(o.veri.miktar) || 0), 0);
    miktarKalan = Math.max(0, Number(v.miktar) - miktarOdenen);
  } else if ((v.kalem === "usd" || v.kalem === "eur") && v.miktar) {
    miktarOdenen = od.filter(o => o.veri.yontem === v.kalem || o.veri.yontem === "doviz").reduce((s, o) => s + (Number(o.veri.miktar) || 0), 0);
    miktarKalan = Math.max(0, Number(v.miktar) - miktarOdenen);
  }
  const bugun = new Date(); bugun.setHours(0,0,0,0);
  const durum = kalan <= 0 ? "Kapandı" : odenen > 0 ? "Kısmi Ödendi" : "Açık";
  const gecikti = durum !== "Kapandı" && v.vade_tarihi && new Date(v.vade_tarihi) < bugun;
  return { od, odenen, kalan, miktarOdenen, miktarKalan, durum, gecikti };
}

const neAlindi = v => {
  if (v.kalem === "altin") return `${v.miktar ? Number(v.miktar).toLocaleString("tr-TR") + " " : ""}${v.altin_cinsi || ""} altın`.trim();
  if (v.kalem === "usd") return `${v.miktar ? Number(v.miktar).toLocaleString("tr-TR") : ""} $`;
  if (v.kalem === "eur") return `${v.miktar ? Number(v.miktar).toLocaleString("tr-TR") : ""} €`;
  if (v.kalem === "cek" || v.kalem === "senet") return `${KALEMLER[v.kalem]}${v.belge ? " · " + v.belge : ""}`;
  return KALEMLER[v.kalem] || v.kalem || "—";
};
const neIle = v => {
  if (v.yontem === "altin") return `${v.miktar || ""} ${v.altin_cinsi || ""} altın`.trim();
  if (v.yontem === "usd") return `${v.miktar || ""} $`.trim();
  if (v.yontem === "eur") return `${v.miktar || ""} €`.trim();
  if (v.yontem === "doviz") return `${v.miktar || ""} döviz`.trim();
  return YONTEMLER[v.yontem] || v.yontem || "—";
};

async function borcAc(m) {
  aktifModul = m; borcModul = m; borcFiltre = "tumu";
  menuIsaretle(m.id);
  $("modul-ad").textContent = m.ad + (m.kol === "kadin" ? " — Kadın Kolu" : "");
  $("modul-aciklama").textContent = "Kimden ne alındı, kim geri ödedi — TL, altın, döviz, çek";
  $("ara").classList.remove("gizli"); $("ara").value = "";
  $("ozet").classList.add("gizli");
  $("icerik").innerHTML = `<div class="yukleniyor">Yükleniyor…</div>`;
  const [{ data: y }, { data: s }, { data: kay, error }] = await Promise.all([
    sb.rpc("modul_yazabilir", { p_modul: m.id }),
    sb.rpc("modul_silebilir", { p_modul: m.id }),
    sb.from("kayitlar").select("*, kullanicilar!kayitlar_olusturan_fkey(ad_soyad)")
      .eq("modul_id", m.id).order("olusturuldu", { ascending: false }),
    kurCek()
  ]);
  if (error) { $("icerik").innerHTML = `<div class="bos">Yüklenemedi: ${kacir(error.message)}</div>`; return; }
  yazabilir = !!y; silebilir = !!s;
  const hepsi = (kay || []).map(borcNormalize);
  borcOdemeler = hepsi.filter(k => k.veri.tip === "odeme");
  borcListe = hepsi.filter(k => k.veri.tip === "borc").sort((a, b) => (b.veri.tarih || "").localeCompare(a.veri.tarih || ""));
  $("ekle-btn").textContent = yazabilir ? "+ Yeni Borç / Alacak" : "+ Talep Oluştur";
  $("ekle-btn").classList.remove("gizli");
  $("ekle-btn").onclick = () => borcFormu(null);
  borcCiz();
}

function borcCiz() {
  const q = $("ara").value.toLowerCase().trim();
  const hesaplar = new Map(borcListe.map(b => [b.id, borcHesap(b)]));

  // --- özet
  const acik = borcListe.filter(b => hesaplar.get(b.id).durum !== "Kapandı");
  const toplam = (yon, alan) => borcListe.filter(b => b.veri.yon === yon).reduce((s, b) => s + hesaplar.get(b.id)[alan], 0);
  const altinOzet = yon => {
    const t = {}; let bugunku = 0;
    acik.filter(b => b.veri.yon === yon && ["altin","usd","eur"].includes(b.veri.kalem)).forEach(b => {
      const h = hesaplar.get(b.id); const c = b.veri.kalem === "altin" ? (b.veri.altin_cinsi || "Altın") : b.veri.kalem.toUpperCase();
      if (h.miktarKalan) { t[c] = (t[c] || 0) + h.miktarKalan; const k = canliBirimKur(b.veri.kalem, b.veri.altin_cinsi); if (k) bugunku += h.miktarKalan * k; } });
    const m = Object.entries(t).map(([c, n]) => `${n} ${c}`).join(", ");
    return m ? m + (bugunku ? ` (bugün ≈ ${paraYaz(bugunku)})` : "") : "";
  };
  const altinB = altinOzet("borc"), altinA = altinOzet("alacak");
  const geciken = acik.filter(b => hesaplar.get(b.id).gecikti).length;
  $("ozet").innerHTML = `
    <div><div class="k">Kalan Borcumuz</div><div class="v" style="color:var(--kirmizi)">${paraYaz(toplam("borc","kalan"))}</div>
      ${altinB ? `<div class="alt">+ ${kacir(altinB)}</div>` : ""}</div>
    <div><div class="k">Kalan Alacağımız</div><div class="v" style="color:#2E9E5B">${paraYaz(toplam("alacak","kalan"))}</div>
      ${altinA ? `<div class="alt">+ ${kacir(altinA)}</div>` : ""}</div>
    <div><div class="k">Toplam Ödenen</div><div class="v">${paraYaz(toplam("borc","odenen"))}</div><div class="alt">borçlarımıza</div></div>
    <div><div class="k">Açık Kayıt</div><div class="v">${acik.length} <span style="font-size:12px;color:var(--soluk)">/ ${borcListe.length}</span></div></div>
    <div><div class="k">Vadesi Geçen</div><div class="v" style="color:${geciken ? "var(--kirmizi)" : "inherit"}">${geciken}</div></div>`;
  $("ozet").classList.remove("gizli");

  // --- filtre + liste
  let liste = borcListe.filter(b => {
    const h = hesaplar.get(b.id);
    if (borcFiltre === "borc" && b.veri.yon !== "borc") return false;
    if (borcFiltre === "alacak" && b.veri.yon !== "alacak") return false;
    if (borcFiltre === "acik" && h.durum === "Kapandı") return false;
    if (borcFiltre === "gecikti" && !h.gecikti) return false;
    if (borcFiltre === "kapandi" && h.durum !== "Kapandı") return false;
    if (q) {
      const metin = JSON.stringify(b.veri).toLowerCase() + h.od.map(o => JSON.stringify(o.veri)).join(" ").toLowerCase();
      if (!metin.includes(q)) return false;
    }
    return true;
  });
  const F = [["tumu","Tümü"],["borc","Borçlarımız"],["alacak","Alacaklarımız"],["acik","Açık"],["gecikti","Vadesi Geçen"],["kapandi","Kapandı"]];
  const filtreler = `<div class="filtreler">${F.map(([k, a]) =>
    `<button class="filtre ${borcFiltre === k ? "aktif" : ""}" data-filtre="${k}">${a}</button>`).join("")}</div>`;

  const rozet = (h) => h.gecikti ? `<span class="rozet acik">Vadesi geçti</span>`
    : `<span class="rozet ${ {"Açık":"acik","Kısmi Ödendi":"kismi","Kapandı":"kapali"}[h.durum] }">${h.durum}</span>`;

  const tablo = !liste.length
    ? `<div class="tablo-kutu"><div class="bos">${q || borcFiltre !== "tumu" ? "Bu filtreye uyan kayıt yok." : "Henüz borç / alacak kaydı yok."}</div></div>`
    : `<div class="tablo-kutu"><table>
      <thead><tr><th>Tarih</th><th>Yön</th><th>Kişi / Kurum</th><th>Ne Alındı</th><th class="sag">Tutar (TL)</th>
      <th class="sag">Ödenen</th><th class="sag">Kalan</th><th>Vade</th><th>Durum</th><th>Son Ödeme</th><th class="sag">İşlem</th></tr></thead>
      <tbody>${liste.map(b => { const v = b.veri, h = hesaplar.get(b.id);
        const son = h.od.slice().sort((a, c) => (c.veri.tarih || "").localeCompare(a.veri.tarih || ""))[0];
        return `<tr>
        <td>${tarihYaz(v.tarih)}</td>
        <td><span class="yon ${v.yon}">${v.yon === "alacak" ? "Alacak" : "Borç"}</span></td>
        <td><b>${kacir(v.karsi_taraf)}</b>${v.aciklama && v.aciklama !== v.karsi_taraf ? `<span class="hucre-alt">${kacir(v.aciklama)}</span>` : ""}</td>
        <td>${kacir(neAlindi(v))}${v.kur && v.kalem !== "tl" ? `<span class="hucre-alt">kur: ${paraYaz(v.kur)}</span>` : ""}</td>
        <td class="sag">${paraYaz(v.tutar_tl)}</td>
        <td class="sag">${paraYaz(h.odenen)}${h.miktarOdenen ? `<span class="hucre-alt">${h.miktarOdenen} ${v.altin_cinsi || ""}</span>` : ""}</td>
        <td class="sag" style="font-weight:700;color:${h.kalan > 0 ? "var(--kirmizi)" : "#2E9E5B"}">${paraYaz(h.kalan)}${h.miktarKalan ? `<span class="hucre-alt">${h.miktarKalan} ${v.kalem === "altin" ? (v.altin_cinsi || "") : v.kalem.toUpperCase()}${(() => { const k = canliBirimKur(v.kalem, v.altin_cinsi); return k ? ` · bugün ≈ ${paraYaz(h.miktarKalan * k)}` : ""; })()}</span>` : ""}</td>
        <td>${tarihYaz(v.vade_tarihi)}</td>
        <td>${rozet(h)}</td>
        <td style="font-size:12px">${son ? `${kacir(son.veri.odeyen)}<span class="hucre-alt">${tarihYaz(son.veri.tarih)} · ${paraYaz(son.veri.tutar_tl)}</span>` : "—"}</td>
        <td class="sag" style="white-space:nowrap">
          ${h.durum !== "Kapandı" ? `<button class="btn kucuk" data-ode="${b.id}">${yazabilir ? "Ödeme" : "Ödeme Talebi"}</button>` : ""}
          <button class="btn ikincil kucuk" data-detay="${b.id}">Detay</button>
          ${silebilir ? `<button class="btn tehlike kucuk" data-sil="${b.id}">Sil</button>` : ""}
        </td></tr>`; }).join("")}</tbody></table></div>`;

  $("icerik").innerHTML = filtreler + tablo;
  $("icerik").querySelectorAll("[data-filtre]").forEach(b => b.onclick = () => { borcFiltre = b.dataset.filtre; borcCiz(); });
  $("icerik").querySelectorAll("[data-ode]").forEach(b => b.onclick = () => borcOdemeFormu(borcListe.find(x => x.id === b.dataset.ode)));
  $("icerik").querySelectorAll("[data-detay]").forEach(b => b.onclick = () => borcDetay(borcListe.find(x => x.id === b.dataset.detay)));
  $("icerik").querySelectorAll("[data-sil]").forEach(b => b.onclick = () => borcSil(borcListe.find(x => x.id === b.dataset.sil)));
}

/* --- detay penceresi: borç bilgisi + ödemeler --- */
function borcDetay(b) {
  const v = b.veri, h = borcHesap(b);
  const satir = (k, d) => d ? `<div class="dt"><span>${k}</span><b>${d}</b></div>` : "";
  $("form-baslik").textContent = `${v.yon === "alacak" ? "Alacak" : "Borç"} — ${v.karsi_taraf}`;
  $("form-govde").innerHTML = `
    <div class="genis detay-kutu">
      ${satir("Kişi / Kurum", kacir(v.karsi_taraf) + (v.karsi_telefon ? " · " + kacir(v.karsi_telefon) : ""))}
      ${satir("Tarih", tarihYaz(v.tarih))}
      ${satir("Ne alındı", kacir(neAlindi(v)))}
      ${v.kur && v.kalem !== "tl" ? satir("O günkü kur", paraYaz(v.kur)) : ""}
      ${satir("TL karşılığı", paraYaz(v.tutar_tl))}
      ${satir("Vade", tarihYaz(v.vade_tarihi))}
      ${satir(v.yon === "alacak" ? "Vakıf adına veren" : "Vakıf adına teslim alan", kacir(v.alan_kisi))}
      ${satir("Belge", kacir(v.belge))}
      ${satir("Açıklama", kacir(v.aciklama))}
      ${satir("Not", kacir(v.not_metni))}
      ${satir("Kaydeden", kacir(b.kullanicilar?.ad_soyad) + " · " + tarihYaz(b.olusturuldu))}
      <div class="dt"><span>Durum</span><b>${h.durum}${h.gecikti ? " · VADESİ GEÇTİ" : ""} — ödenen ${paraYaz(h.odenen)}, kalan <span style="color:${h.kalan ? "var(--kirmizi)" : "#2E9E5B"}">${paraYaz(h.kalan)}</span>${h.miktarKalan ? ` (${h.miktarKalan} ${v.altin_cinsi})` : ""}</b></div>
    </div>
    <div class="genis">
      <div class="kira-bolum" style="margin-top:4px">Geri Ödemeler (${h.od.length})</div>
      ${v._eski_odenen ? `<div style="font-size:12px;color:var(--soluk);margin-bottom:8px">Eski kayıttan aktarılan ödenen tutar: ${paraYaz(v._eski_odenen)}</div>` : ""}
      ${h.od.length ? `<div class="tablo-kutu"><table style="min-width:0">
        <thead><tr><th>Tarih</th><th>Kim Ödedi</th><th>Ne ile</th><th class="sag">Tutar</th><th>Teslim Alan</th><th>Açıklama</th><th>Kaydeden</th>${silebilir ? "<th></th>" : ""}</tr></thead>
        <tbody>${h.od.slice().sort((a, c) => (a.veri.tarih || "").localeCompare(c.veri.tarih || "")).map(o => `<tr>
          <td>${tarihYaz(o.veri.tarih)}</td><td><b>${kacir(o.veri.odeyen)}</b></td>
          <td>${kacir(neIle(o.veri))}${o.veri.kur ? `<span class="hucre-alt">kur: ${paraYaz(o.veri.kur)}</span>` : ""}</td>
          <td class="sag">${paraYaz(o.veri.tutar_tl)}</td>
          <td>${kacir(o.veri.teslim_alan || "—")}</td>
          <td style="font-size:12px;color:var(--soluk)">${kacir(o.veri.aciklama || "")}</td>
          <td style="font-size:12px">${kacir(o.kullanicilar?.ad_soyad || "—")}</td>
          ${silebilir ? `<td><button class="btn tehlike kucuk" data-odeme-sil="${o.id}">Sil</button></td>` : ""}
        </tr>`).join("")}</tbody></table></div>` : `<div class="bos" style="padding:16px">Henüz geri ödeme yok.</div>`}
    </div>
    <div class="genis" style="display:flex;gap:8px;flex-wrap:wrap">
      ${h.durum !== "Kapandı" ? `<button class="btn kucuk" id="dt-ode">${yazabilir ? "+ Ödeme Ekle" : "+ Ödeme Talebi"}</button>` : ""}
      ${yazabilir ? `<button class="btn ikincil kucuk" id="dt-duzenle">Borcu Düzenle</button>` : ""}
    </div>`;
  $("form-kaydet").classList.add("gizli");
  $("form-iptal").textContent = "Kapat";
  const de = $("dt-ode"); if (de) de.onclick = () => borcOdemeFormu(b);
  const dd = $("dt-duzenle"); if (dd) dd.onclick = () => borcFormu(b);
  $("form-govde").querySelectorAll("[data-odeme-sil]").forEach(x => x.onclick = async () => {
    if (!confirm("Bu ödeme kaydı silinecek. Emin misiniz?")) return;
    const { error } = await sb.from("kayitlar").delete().eq("id", x.dataset.odemeSil);
    if (error) { alert("Silinemedi: " + error.message); return; }
    await borcAc(borcModul); borcDetay(borcListe.find(z => z.id === b.id));
  });
  $("perde").classList.remove("gizli");
}
function borcPencereSifirla() { $("form-kaydet").classList.remove("gizli"); $("form-iptal").textContent = "İptal"; }

/* --- borç / alacak formu --- */
function borcFormu(b) {
  borcPencereSifirla();
  const v = b?.veri || {};
  const bugun = new Date();
  const sec = (id, obj, secili, bos) => `<select id="${id}">${bos ? `<option value="">${bos}</option>` : ""}${
    (Array.isArray(obj) ? obj.map(x => [x, x]) : Object.entries(obj)).map(([k, a]) =>
      `<option value="${k}" ${k === secili ? "selected" : ""}>${a}</option>`).join("")}</select>`;
  $("form-baslik").textContent = b ? "Borç / Alacak Düzenle" : (yazabilir ? "Yeni Borç / Alacak" : "Borç / Alacak Talebi");
  $("form-govde").innerHTML = `
    <div class="alan"><label>Yön <span style="color:var(--kirmizi)">*</span></label>
      ${sec("bf-yon", { borc:"BORÇ — vakıf aldı, geri ödeyecek", alacak:"ALACAK — vakıf verdi, geri alacak" }, v.yon || "borc")}</div>
    <div class="alan"><label>Tarih <span style="color:var(--kirmizi)">*</span></label>
      <input type="date" id="bf-tarih" value="${v.tarih || `${donemStr(bugun)}-${String(bugun.getDate()).padStart(2,"0")}`}"></div>
    <div class="alan"><label>Kişi / Kurum <span style="color:var(--kirmizi)">*</span></label>
      <input type="text" id="bf-karsi" value="${kacir(v.karsi_taraf || "")}" placeholder="kimden alındı / kime verildi"></div>
    <div class="alan"><label>Telefon</label><input type="text" id="bf-tel" value="${kacir(v.karsi_telefon || "")}"></div>
    <div class="alan"><label>Ne alındı <span style="color:var(--kirmizi)">*</span></label>${sec("bf-kalem", KALEMLER, v.kalem || "tl")}</div>
    <div class="alan" id="bf-cins-alan"><label>Altın cinsi</label>${sec("bf-cins", ALTIN_CINSLERI, v.altin_cinsi, "— seçiniz —")}</div>
    <div class="alan" id="bf-miktar-alan"><label>Miktar (adet / gram / döviz)</label>
      <input type="number" step="0.01" id="bf-miktar" value="${v.miktar ?? ""}"></div>
    <div class="alan" id="bf-kur-alan"><label>O günkü birim kur (₺)</label>
      <input type="number" step="0.01" id="bf-kur" value="${v.kur ?? ""}" placeholder="1 adet / 1 gram / 1 $ kaç TL">
      <div class="kur-ipucu" id="bf-kur-ipucu"></div></div>
    <div class="alan"><label>TL karşılığı <span style="color:var(--kirmizi)">*</span></label>
      <input type="number" step="0.01" id="bf-tutar" value="${v.tutar_tl ?? ""}"></div>
    <div class="alan"><label>Vade tarihi</label><input type="date" id="bf-vade" value="${v.vade_tarihi || ""}"></div>
    <div class="alan"><label>Vakıf adına teslim alan / veren</label>
      <input type="text" id="bf-alan" value="${kacir(v.alan_kisi || "")}"></div>
    <div class="alan"><label>Belge (çek / senet no, banka)</label><input type="text" id="bf-belge" value="${kacir(v.belge || "")}"></div>
    <div class="alan genis"><label>Açıklama</label><input type="text" id="bf-aciklama" value="${kacir(v.aciklama || "")}" placeholder="ne için alındı"></div>
    <div class="alan genis"><label>Not</label><textarea rows="2" id="bf-not">${kacir(v.not_metni || "")}</textarea></div>`;
  const kalemDegisti = () => {
    const k = $("bf-kalem").value;
    $("bf-cins-alan").classList.toggle("gizli", k !== "altin");
    $("bf-miktar-alan").classList.toggle("gizli", !["altin","usd","eur","esya"].includes(k));
    $("bf-kur-alan").classList.toggle("gizli", !["altin","usd","eur"].includes(k));
  };
  const hesapla = () => { const m = Number($("bf-miktar").value), k = Number($("bf-kur").value);
    if (m && k && ["altin","usd","eur"].includes($("bf-kalem").value)) $("bf-tutar").value = (m * k).toFixed(2); };
  kurIpucuBagla("bf-kalem", "bf-cins", "bf-kur", "bf-kur-ipucu", hesapla, !b);
  $("bf-kalem").onchange = () => { kalemDegisti(); kurIpucuGuncelle("bf-kalem", "bf-cins", "bf-kur", "bf-kur-ipucu", hesapla, !b); };
  $("bf-miktar").oninput = hesapla; $("bf-kur").oninput = hesapla;
  kalemDegisti();
  $("form-kaydet").textContent = yazabilir ? "Kaydet" : "Talep Gönder";
  $("form-kaydet").onclick = async () => {
    const karsi = $("bf-karsi").value.trim(), tarih = $("bf-tarih").value, tutar = Number($("bf-tutar").value);
    if (!karsi || !tarih || !tutar) { alert("Kişi/kurum, tarih ve TL karşılığı zorunlu."); return; }
    const kalem = $("bf-kalem").value;
    if (kalem === "altin" && !$("bf-cins").value) { alert("Altın cinsini seçin."); return; }
    const num = id => $(id).value !== "" ? Number($(id).value) : null;
    const veri = { tip:"borc", yon: $("bf-yon").value, tarih, karsi_taraf: karsi, karsi_telefon: $("bf-tel").value.trim() || null,
      kalem, altin_cinsi: kalem === "altin" ? $("bf-cins").value : null,
      miktar: ["altin","usd","eur","esya"].includes(kalem) ? num("bf-miktar") : null,
      kur: ["altin","usd","eur"].includes(kalem) ? num("bf-kur") : null,
      tutar_tl: tutar, vade_tarihi: $("bf-vade").value || null, alan_kisi: $("bf-alan").value.trim() || null,
      belge: $("bf-belge").value.trim() || null, aciklama: $("bf-aciklama").value.trim() || null,
      not_metni: $("bf-not").value.trim() || null };
    if (v._eski_odenen) veri._eski_odenen = v._eski_odenen;
    const baslik = `${karsi} — ${neAlindi(veri)} (${paraYaz(tutar)})`;
    const kol = b?.kol || borcModul.kol || ben.kol;
    $("form-kaydet").textContent = "Kaydediliyor…";
    let hata;
    if (!yazabilir) ({ error: hata } = await sb.from("talepler").insert({ modul_id: borcModul.id, tip: b ? "duzeltme" : "ekleme",
        kayit_id: b?.id || null, veri: { ...veri, kol, baslik }, olusturan: ben.id }));
    else if (b) ({ error: hata } = await sb.from("kayitlar").update({ veri, baslik }).eq("id", b.id));
    else ({ error: hata } = await sb.from("kayitlar").insert({ modul_id: borcModul.id, kol, veri, baslik, olusturan: ben.id }));
    $("form-kaydet").textContent = "Kaydet";
    if (hata) { alert("Kaydedilemedi: " + hata.message); return; }
    $("perde").classList.add("gizli");
    if (!yazabilir) { alert("Talebiniz gönderildi. Yetkili onayına düştü."); return; }
    borcAc(borcModul);
  };
  $("perde").classList.remove("gizli");
}

/* --- geri ödeme formu --- */
function borcOdemeFormu(b) {
  borcPencereSifirla();
  const v = b.veri, h = borcHesap(b), bugun = new Date();
  const sec = (id, obj, secili, bos) => `<select id="${id}">${bos ? `<option value="">${bos}</option>` : ""}${
    (Array.isArray(obj) ? obj.map(x => [x, x]) : Object.entries(obj)).map(([k, a]) =>
      `<option value="${k}" ${k === secili ? "selected" : ""}>${a}</option>`).join("")}</select>`;
  $("form-baslik").textContent = `${v.yon === "alacak" ? "Tahsilat" : "Geri Ödeme"} — ${v.karsi_taraf}`;
  $("form-govde").innerHTML = `
    <div class="genis" style="font-size:13px;color:var(--soluk);background:#F1F6F6;padding:10px 12px;border-radius:6px">
      ${kacir(neAlindi(v))} · toplam ${paraYaz(v.tutar_tl)} · ödenen ${paraYaz(h.odenen)} · <b style="color:var(--kirmizi)">kalan ${paraYaz(h.kalan)}</b>${h.miktarKalan ? ` (${h.miktarKalan} ${v.altin_cinsi})` : ""}</div>
    <div class="alan"><label>Tarih <span style="color:var(--kirmizi)">*</span></label>
      <input type="date" id="bo-tarih" value="${donemStr(bugun)}-${String(bugun.getDate()).padStart(2,"0")}"></div>
    <div class="alan"><label>${v.yon === "alacak" ? "Kim ödedi (karşı taraftan)" : "Kim ödedi (vakıf adına)"} <span style="color:var(--kirmizi)">*</span></label>
      <input type="text" id="bo-odeyen" value="${kacir(v.yon === "alacak" ? v.karsi_taraf : ben.ad_soyad)}"></div>
    <div class="alan"><label>Ne ile ödendi <span style="color:var(--kirmizi)">*</span></label>
      ${sec("bo-yontem", YONTEMLER, ["altin","usd","eur"].includes(v.kalem) ? v.kalem : "nakit")}</div>
    <div class="alan" id="bo-cins-alan"><label>Altın cinsi</label>${sec("bo-cins", ALTIN_CINSLERI, v.altin_cinsi, "— seçiniz —")}</div>
    <div class="alan" id="bo-miktar-alan"><label>Miktar (adet / gram / döviz)</label><input type="number" step="0.01" id="bo-miktar"></div>
    <div class="alan" id="bo-kur-alan"><label>O günkü kur (₺)</label><input type="number" step="0.01" id="bo-kur">
      <div class="kur-ipucu" id="bo-kur-ipucu"></div></div>
    <div class="alan"><label>Tutar (TL) <span style="color:var(--kirmizi)">*</span></label>
      <input type="number" step="0.01" id="bo-tutar" value="${h.kalan || ""}"></div>
    <div class="alan"><label>Teslim alan</label><input type="text" id="bo-teslim" value="${kacir(v.yon === "alacak" ? "" : v.karsi_taraf)}"></div>
    <div class="alan genis"><label>Açıklama</label><input type="text" id="bo-aciklama" placeholder="örn. kermes gelirinden, havale dekont no…"></div>`;
  const yontemDegisti = () => { const y = $("bo-yontem").value, dv = ["altin","usd","eur"].includes(y);
    $("bo-cins-alan").classList.toggle("gizli", y !== "altin");
    $("bo-miktar-alan").classList.toggle("gizli", !dv);
    $("bo-kur-alan").classList.toggle("gizli", !dv); };
  const hesapla = () => { const m = Number($("bo-miktar").value), k = Number($("bo-kur").value); if (m && k) $("bo-tutar").value = (m * k).toFixed(2); };
  kurIpucuBagla("bo-yontem", "bo-cins", "bo-kur", "bo-kur-ipucu", hesapla, true);
  $("bo-yontem").onchange = () => { yontemDegisti(); kurIpucuGuncelle("bo-yontem", "bo-cins", "bo-kur", "bo-kur-ipucu", hesapla, true); };
  $("bo-miktar").oninput = hesapla; $("bo-kur").oninput = hesapla; yontemDegisti();
  $("form-kaydet").textContent = yazabilir ? "Kaydet" : "Talep Gönder";
  $("form-kaydet").onclick = async () => {
    const tarih = $("bo-tarih").value, odeyen = $("bo-odeyen").value.trim(), tutar = Number($("bo-tutar").value);
    if (!tarih || !odeyen || !tutar) { alert("Tarih, ödeyen ve tutar zorunlu."); return; }
    if (tutar > h.kalan + 0.01 && !confirm(`Tutar kalandan (${paraYaz(h.kalan)}) fazla. Yine de kaydedeyim mi?`)) return;
    const y = $("bo-yontem").value, num = id => $(id).value !== "" ? Number($(id).value) : null;
    const veri = { tip:"odeme", borc_id: b.id, tarih, odeyen, yontem: y,
      altin_cinsi: y === "altin" ? $("bo-cins").value || null : null,
      miktar: ["altin","usd","eur"].includes(y) ? num("bo-miktar") : null,
      kur: ["altin","usd","eur"].includes(y) ? num("bo-kur") : null,
      tutar_tl: tutar, teslim_alan: $("bo-teslim").value.trim() || null, aciklama: $("bo-aciklama").value.trim() || null };
    const baslik = `${v.karsi_taraf} ← ${odeyen} ${paraYaz(tutar)} (${tarih})`;
    $("form-kaydet").textContent = "Kaydediliyor…";
    let hata;
    if (!yazabilir) ({ error: hata } = await sb.from("talepler").insert({ modul_id: borcModul.id, tip: "ekleme",
        veri: { ...veri, kol: b.kol, baslik }, olusturan: ben.id }));
    else ({ error: hata } = await sb.from("kayitlar").insert({ modul_id: borcModul.id, kol: b.kol, veri, baslik, olusturan: ben.id }));
    $("form-kaydet").textContent = "Kaydet";
    if (hata) { alert("Kaydedilemedi: " + hata.message); return; }
    $("perde").classList.add("gizli");
    if (!yazabilir) { alert("Talebiniz gönderildi. Yetkili onayına düştü."); return; }
    borcAc(borcModul);
  };
  $("perde").classList.remove("gizli");
}

/* --- anlık kur ipucu: kalem/cins değişince kuru çek, göster, boşsa doldur --- */
function kurIpucuGuncelle(kalemId, cinsId, kurId, ipucuId, hesapla, otomatikDoldur) {
  const ip = $(ipucuId); if (!ip) return;
  let kalem = $(kalemId).value; if (kalem === "doviz") kalem = "usd";   // ödeme formunda döviz → dolar varsayılan
  const cins = $(cinsId)?.value;
  if (!["altin","usd","eur"].includes(kalem)) { ip.innerHTML = ""; return; }
  if (kalem === "altin" && !cins) { ip.innerHTML = `<span>Altın cinsini seçin, anlık kur gelsin.</span>`; return; }
  ip.innerHTML = `<span>Anlık kur alınıyor…</span>`;
  kurCek().then(() => {
    const k = canliBirimKur(kalem, cins);
    if (!k) { ip.innerHTML = `<span style="color:var(--kirmizi)">Anlık kur alınamadı, elle girin.</span>`; return; }
    const ad = kalem === "altin" ? cins : kalem.toUpperCase();
    ip.innerHTML = `<span>Anlık ${kacir(ad)} satış: <b>${paraYaz(k)}</b>${kurZamanYaz()}</span> <button type="button" class="btn kucuk ikincil" id="${ipucuId}-btn">Kullan</button>`;
    $(`${ipucuId}-btn`).onclick = () => { $(kurId).value = k.toFixed(2); hesapla(); };
    if (otomatikDoldur && !$(kurId).value) { $(kurId).value = k.toFixed(2); hesapla(); }
  });
}
function kurIpucuBagla(kalemId, cinsId, kurId, ipucuId, hesapla, otomatikDoldur) {
  const c = $(cinsId); if (c) c.onchange = () => kurIpucuGuncelle(kalemId, cinsId, kurId, ipucuId, hesapla, otomatikDoldur);
  kurIpucuGuncelle(kalemId, cinsId, kurId, ipucuId, hesapla, otomatikDoldur);
}

async function borcSil(b) {
  const h = borcHesap(b);
  if (!confirm(`"${b.veri.karsi_taraf}" kaydı ve altındaki ${h.od.length} ödeme kalıcı olarak silinecek. Emin misiniz?`)) return;
  if (h.od.length) await sb.from("kayitlar").delete().in("id", h.od.map(o => o.id));
  const { error } = await sb.from("kayitlar").delete().eq("id", b.id);
  if (error) { alert("Silinemedi: " + error.message); return; }
  borcAc(borcModul);
}

/* =====================================================================
   KULLANICILAR — sadece erkek Başkan/Müdür. Kullanıcı adı + şifre ile hesap
   açma, görev / kol / çalışma yeri, şifre sıfırlama, güncel şifreleri görme.
   Giriş sistemi e-posta istediği için kullanıcı adına @vakif.local eklenir.
   ===================================================================== */
const GIRIS_ALANI = "vakif.local";
const YER_AD = { sube: "Şube", dergah: "Dergah" };
const kullaniciAdiUret = ad => ad.toLowerCase().trim()
  .replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i").replace(/i̇/g,"i")
  .replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,".").replace(/^\.|\.$/g,"");
let kulListe = [], kulSifreler = {}, kulModuller = [];

async function kullanicilarAc() {
  aktifModul = null;
  menuIsaretle("kullanicilar");
  $("modul-ad").textContent = "Kullanıcılar";
  $("modul-aciklama").textContent = "Hesap aç, görev ve yetki ver, şifre sıfırla";
  $("ozet").classList.add("gizli"); $("ara").classList.add("gizli");
  $("ekle-btn").textContent = "+ Yeni Kullanıcı"; $("ekle-btn").classList.remove("gizli");
  $("ekle-btn").onclick = () => kullaniciFormu(null);
  $("icerik").innerHTML = `<div class="yukleniyor">Yükleniyor…</div>`;

  const [{ data: kullar, error }, { data: sifreler }, { data: mods }] = await Promise.all([
    sb.from("kullanicilar").select("*").order("kol").order("gorev").order("ad_soyad"),
    sb.from("kullanici_sifreleri").select("*"),
    sb.from("moduller").select("*").order("sira")
  ]);
  if (error && /kullanici_adi|calisma_yeri|kullanici_sifreleri/.test(error.message)) {
    $("icerik").innerHTML = `<div class="tablo-kutu"><div class="bos">Kullanıcı yönetimi için veritabanı hazırlığı yapılmamış.<br>
      <b>05_kullanici_yonetimi.sql</b> dosyasını Supabase &gt; SQL Editor'da bir kez çalıştırın.</div></div>`; return;
  }
  if (error) { $("icerik").innerHTML = `<div class="bos">Yüklenemedi: ${kacir(error.message)}</div>`; return; }
  kulListe = kullar || []; kulModuller = mods || [];
  kulSifreler = Object.fromEntries((sifreler || []).map(s => [s.kullanici_id, s]));
  if (!("kullanici_adi" in (kulListe[0] || { kullanici_adi: 1 }))) {
    $("icerik").innerHTML = `<div class="tablo-kutu"><div class="bos">Kullanıcı yönetimi için veritabanı hazırlığı yapılmamış.<br>
      <b>05_kullanici_yonetimi.sql</b> dosyasını Supabase &gt; SQL Editor'da bir kez çalıştırın.</div></div>`; return;
  }

  const grup = kol => kulListe.filter(k => k.kol === kol);
  const satir = k => { const s = kulSifreler[k.id]; return `<tr>
    <td><b>${kacir(k.ad_soyad)}</b>${k.telefon ? `<span class="hucre-alt">${kacir(k.telefon)}</span>` : ""}</td>
    <td><code style="font-size:12.5px">${kacir(k.kullanici_adi || "—")}</code></td>
    <td>${GOREV_AD[k.gorev]}</td>
    <td>${YER_AD[k.calisma_yeri] || "—"}</td>
    <td>${s ? `<span class="sifre-gizli" data-sifre="${kacir(s.sifre)}">••••••••</span>
        <button class="btn ikincil kucuk" data-goster="${k.id}" title="Göster / gizle">👁</button>
        <span class="hucre-alt">${tarihYaz(s.guncellendi)}</span>` : `<span style="color:var(--soluk);font-size:12px">bilinmiyor</span>`}</td>
    <td><span class="rozet ${k.aktif ? "kapali" : "acik"}">${k.aktif ? "Aktif" : "Kapalı"}</span></td>
    <td class="sag" style="white-space:nowrap">
      <button class="btn ikincil kucuk" data-duzenle="${k.id}">Düzenle</button>
      <button class="btn ikincil kucuk" data-sifre-sifirla="${k.id}">Şifre Sıfırla</button>
      <button class="btn ikincil kucuk" data-yetki="${k.id}">Yetkiler</button>
      ${k.id !== ben.id ? `<button class="btn ikincil kucuk" data-durum="${k.id}">${k.aktif ? "Kapat" : "Aç"}</button>
        <button class="btn tehlike kucuk" data-sil="${k.id}">Sil</button>` : ""}
    </td></tr>`; };
  const tablo = (baslik, liste) => `<div class="kira-bolum">${baslik} (${liste.length})</div>
    <div class="tablo-kutu"><table>
      <thead><tr><th>Ad Soyad</th><th>Kullanıcı Adı</th><th>Görev</th><th>Çalıştığı Yer</th><th>Şifre</th><th>Durum</th><th class="sag">İşlem</th></tr></thead>
      <tbody>${liste.length ? liste.map(satir).join("") : `<tr><td colspan="7" class="bos" style="padding:18px">Kullanıcı yok.</td></tr>`}</tbody></table></div>`;

  $("icerik").innerHTML = `
    <div style="font-size:12.5px;color:var(--soluk);background:#E8F6F6;padding:10px 13px;border-radius:7px;margin-bottom:14px;line-height:1.5">
      Kullanıcı <b>kullanıcı adı + şifre</b> ile giriş yapar, e-posta gerekmez. Görevine ve koluna göre modülleri otomatik görür;
      ek modül için <b>Yetkiler</b>. Şifre sütununda kullanıcının güncel şifresi durur (kendisi değiştirse de güncellenir).
    </div>
    ${tablo("Erkek Kolu", grup("erkek"))}
    ${tablo("Kadın Kolu", grup("kadin"))}`;

  const bul = id => kulListe.find(k => k.id === id);
  $("icerik").querySelectorAll("[data-goster]").forEach(b => b.onclick = () => {
    const el = b.previousElementSibling; const acik = el.textContent !== "••••••••";
    el.textContent = acik ? "••••••••" : el.dataset.sifre; });
  $("icerik").querySelectorAll("[data-duzenle]").forEach(b => b.onclick = () => kullaniciFormu(bul(b.dataset.duzenle)));
  $("icerik").querySelectorAll("[data-sifre-sifirla]").forEach(b => b.onclick = () => sifreSifirlaFormu(bul(b.dataset.sifreSifirla)));
  $("icerik").querySelectorAll("[data-yetki]").forEach(b => b.onclick = () => yetkiFormu(bul(b.dataset.yetki), kulModuller));
  $("icerik").querySelectorAll("[data-durum]").forEach(b => b.onclick = async () => {
    const k = bul(b.dataset.durum);
    const { error } = await sb.from("kullanicilar").update({ aktif: !k.aktif }).eq("id", k.id);
    if (error) alert("Değiştirilemedi: " + error.message); kullanicilarAc(); });
  $("icerik").querySelectorAll("[data-sil]").forEach(b => b.onclick = async () => {
    const k = bul(b.dataset.sil);
    if (!confirm(`"${k.ad_soyad}" kullanıcısı ve giriş hesabı kalıcı olarak silinecek. Kayıtları kalır. Emin misiniz?`)) return;
    const { error } = await sb.rpc("kullanici_sil", { p_kullanici: k.id });
    if (error) { alert("Silinemedi: " + error.message); return; }
    kullanicilarAc(); });
}

/* --- yeni kullanıcı / düzenle --- */
function kullaniciFormu(kul) {
  borcPencereSifirla();
  const yeni = !kul; const k = kul || {};
  const sec = (id, obj, secili) => `<select id="${id}">${Object.entries(obj).map(([v, a]) =>
    `<option value="${v}" ${v === secili ? "selected" : ""}>${a}</option>`).join("")}</select>`;
  $("form-baslik").textContent = yeni ? "Yeni Kullanıcı" : `Düzenle — ${k.ad_soyad}`;
  $("form-govde").innerHTML = `
    <div class="alan genis"><label>Ad Soyad <span style="color:var(--kirmizi)">*</span></label>
      <input id="y-ad" value="${kacir(k.ad_soyad || "")}" placeholder="Ahmet Yılmaz"></div>
    <div class="alan"><label>Kullanıcı adı <span style="color:var(--kirmizi)">*</span></label>
      <input id="y-kadi" value="${kacir(k.kullanici_adi || "")}" placeholder="ahmet.yilmaz" ${yeni ? "" : "disabled"} autocomplete="off">
      ${yeni ? `<div class="kur-ipucu">Ad yazınca kendiliğinden oluşur, değiştirebilirsin. Sadece küçük harf, rakam ve nokta.</div>` : `<div class="kur-ipucu">Kullanıcı adı sonradan değişmez.</div>`}</div>
    <div class="alan"><label>Telefon</label><input id="y-tel" value="${kacir(k.telefon || "")}" placeholder="05xx"></div>
    <div class="alan"><label>Kol <span style="color:var(--kirmizi)">*</span></label>${sec("y-kol", KOL_AD, k.kol || "erkek")}</div>
    <div class="alan"><label>Görev <span style="color:var(--kirmizi)">*</span></label>${sec("y-gorev", GOREV_AD, k.gorev || "vekil")}</div>
    <div class="alan"><label>Çalıştığı yer <span style="color:var(--kirmizi)">*</span></label>${sec("y-yer", YER_AD, k.calisma_yeri || "sube")}</div>
    ${yeni ? `<div class="alan"><label>Şifre <span style="color:var(--kirmizi)">*</span></label>
      <div style="display:flex;gap:8px"><input id="y-sifre" value="${sifreUret()}" autocomplete="new-password">
      <button type="button" class="btn ikincil kucuk" id="y-yeni-sifre" style="white-space:nowrap">Yenile</button></div>
      <div class="kur-ipucu">En az 6 karakter. İstersen elle yaz.</div></div>` : ""}
    <div class="genis" style="font-size:12px;color:var(--soluk);background:#F1F6F6;padding:9px 12px;border-radius:6px;line-height:1.5">
      <b>Görevler:</b> Başkan / Müdür her şeyi görür (kadın koldaysa sadece kadın kolunu). Ticaret, Sosyal, Dergi kendi modülünü görür.
      Vekil sadece okur. Ek modül için kaydettikten sonra <b>Yetkiler</b>.</div>`;
  if (yeni) {
    let elleDegisti = false;
    $("y-kadi").oninput = () => { elleDegisti = true; $("y-kadi").value = kullaniciAdiUret($("y-kadi").value + " ").replace(/\.$/, "") ; };
    $("y-ad").oninput = () => { if (!elleDegisti) $("y-kadi").value = kullaniciAdiUret($("y-ad").value); };
    $("y-yeni-sifre").onclick = () => { $("y-sifre").value = sifreUret(); };
  }
  $("form-kaydet").textContent = yeni ? "Kullanıcıyı Oluştur" : "Kaydet";
  $("form-kaydet").onclick = async () => {
    const ad = $("y-ad").value.trim(), kadi = kullaniciAdiUret($("y-kadi").value), tel = $("y-tel").value.trim() || null;
    const kol = $("y-kol").value, gorev = $("y-gorev").value, yer = $("y-yer").value;
    if (!ad || !kadi) { alert("Ad Soyad ve kullanıcı adı gerekli."); return; }
    if (!yeni) {
      $("form-kaydet").textContent = "Kaydediliyor…";
      const { error } = await sb.from("kullanicilar").update({ ad_soyad: ad, telefon: tel, kol, gorev, calisma_yeri: yer }).eq("id", kul.id);
      $("form-kaydet").textContent = "Kaydet";
      if (error) { alert("Kaydedilemedi: " + error.message); return; }
      $("perde").classList.add("gizli"); kullanicilarAc(); return;
    }
    const sifre = $("y-sifre").value;
    if (sifre.length < 6) { alert("Şifre en az 6 karakter olmalı."); return; }
    if (kulListe.some(x => (x.kullanici_adi || "").toLowerCase() === kadi)) { alert("Bu kullanıcı adı zaten var."); return; }
    $("form-kaydet").textContent = "Oluşturuluyor…";
    const eposta = `${kadi}@${GIRIS_ALANI}`;
    const { data, error } = await sbKayit.auth.signUp({ email: eposta, password: sifre });
    if (error || !data?.user) { $("form-kaydet").textContent = "Kullanıcıyı Oluştur";
      alert("Hesap açılamadı: " + (error?.message || "bilinmeyen hata")); return; }
    const { error: e2 } = await sb.from("kullanicilar").insert({ id: data.user.id, ad_soyad: ad, telefon: tel, kol, gorev, kullanici_adi: kadi, calisma_yeri: yer });
    if (e2) { $("form-kaydet").textContent = "Kullanıcıyı Oluştur"; alert("Hesap açıldı ama kullanıcı kaydı yapılamadı: " + e2.message); return; }
    await sb.from("kullanici_sifreleri").upsert({ kullanici_id: data.user.id, sifre, guncelleyen: ben.id, guncellendi: new Date().toISOString() });
    await sbKayit.auth.signOut();
    $("form-kaydet").textContent = "Kullanıcıyı Oluştur";
    $("perde").classList.add("gizli");
    alert(`Kullanıcı oluşturuldu.\n\nAd: ${ad}\nKullanıcı adı: ${kadi}\nŞifre: ${sifre}\n\nBu bilgileri kullanıcıya ilet. Şifre Kullanıcılar ekranında da görünür.`);
    kullanicilarAc();
  };
  $("perde").classList.remove("gizli");
}

    <div class="alan genis"><label>Yeni şifre</label>
      <div style="display:flex;gap:8px"><input id="ss-sifre" value="${sifreUret()}" autocomplete="new-password">

      <div class="kur-ipucu">En az 6 karakter. Kullanıcının eski şifresi anında geçersiz olur.</div></div>`;
  $("ss-yenile").onclick = () => { $("ss-sifre").value = sifreUret(); };
  $("form-kaydet").textContent = "Şifreyi Değiştir";

    const sifre = $("ss-sifre").value;
